<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner Questions</title>
<!-- Throwaway prototype. Real questions real 1.5T owners posted (docs/research/owner-voices.md), answered from
     this owner's own drives by the real engine. Nothing in the app imports this. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Chakra+Petch:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
:root {
  --paper: #EDF0F2; --sheet: #FFFFFF; --sheet-2: #F6F8F9; --sheet-3: #EEF2F5;
  --ink: #111B24; --ink-2: #3D4955; --ink-3: #5B6874; --line: #D5DCE2; --line-2: #E6EBEF;
  --accent: #2450C8; --accent-tint: #E8EEFB; --accent-text: #2450C8; --accent-line: #AFC3EE;
  --good-bg: #E5F3E8; --good-fg: #1C6B32; --watch-bg: #FFF2D2; --watch-fg: #6E4A00; --watch-ic: #B07A00;
  --stop-bg: #FCE3DF; --stop-fg: #8F2216; --stop-ic: #C8402F; --none-bg: #EDF1F4; --none-fg: #45515C;
  --meas: #2A78D6; --cmd: #EB6834; --grid: #E3E8EC; --axis: #9AA6B2; --lug: #F39A4F; --band: #EAF2FC;
  --font-d: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-b: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-m: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1317; --sheet: #151C22; --sheet-2: #1A2229; --sheet-3: #202932;
    --ink: #E7ECF0; --ink-2: #B6C0C9; --ink-3: #93A0AC; --line: #2A343D; --line-2: #222B33;
    --accent: #7D9CF6; --accent-tint: #1D2947; --accent-text: #A9BEFA; --accent-line: #3B5190;
    --good-bg: #15301E; --good-fg: #93D9A6; --watch-bg: #372B0D; --watch-fg: #F2CB6B; --watch-ic: #D9A21F;
    --stop-bg: #3B1B17; --stop-fg: #F5A698; --stop-ic: #E0604E; --none-bg: #212A32; --none-fg: #B6C0C9;
    --meas: #3987E5; --cmd: #E0692F; --grid: #25303A; --axis: #56636F; --lug: #C9671C; --band: #1A283A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-b); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent-text); }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { font-family: var(--font-d); margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; line-height: 1.2; } h2 { font-size: 21px; line-height: 1.3; } h3 { font-size: 15px; }
p { margin: 8px 0 0; color: var(--ink-2); }
.eyebrow { font: 600 12px/1.4 var(--font-b); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.muted { color: var(--ink-3); font-size: 13px; }
.num { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
header.hero { padding: 28px 0 16px; }
.frame { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media (max-width: 720px) { .frame { grid-template-columns: 1fr; } }
blockquote { margin: 10px 0 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); color: var(--ink); font-size: 15px; }
blockquote footer { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.qlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; margin-top: 12px; }
.q { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 12px 14px; transition: border-color 150ms ease-out; }
.q:hover { border-color: var(--accent-line); }
.q[aria-current="true"] { border-color: var(--accent); background: var(--accent-tint); }
.q b { display: block; font-size: 15px; line-height: 1.35; }
.q span { font-size: 12px; color: var(--ink-3); }
section.step { padding: 22px 0 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
.tile { background: var(--sheet-2); border-radius: 10px; padding: 10px 12px; }
.tile b { display: block; font: 600 19px/1.2 var(--font-m); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--ink-3); }
table.t { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line-2); vertical-align: top; }
table.t th { font: 600 12px var(--font-b); color: var(--ink-3); border-top: 0; }
table.t td.n { font-family: var(--font-m); font-variant-numeric: tabular-nums; text-align: right; }
.scroll-x { overflow-x: auto; }
.v { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font: 700 12px/20px var(--font-d); }
.v::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.v-good { background: var(--good-bg); color: var(--good-fg); } .v-watch { background: var(--watch-bg); color: var(--watch-fg); }
.v-stop { background: var(--stop-bg); color: var(--stop-fg); } .v-none { background: var(--none-bg); color: var(--none-fg); }
.answer { border: 2px solid var(--accent-line); }
.answer .big { font: 700 19px/1.3 var(--font-d); color: var(--ink); }
.todo { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); }
.todo li + li { margin-top: 4px; }
.kt { margin-top: 10px; background: var(--sheet-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.kt b { font-family: var(--font-m); font-weight: 600; }
svg.chart { display: block; width: 100%; height: auto; margin-top: 8px; }
svg.chart text { font: 10px var(--font-m); fill: var(--ink-3); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 4px; }
.better { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.better li + li { margin-top: 4px; }
footer.page { padding: 28px 0 48px; }
.boot { padding: 80px 16px; text-align: center; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"><div class="boot">Reading the owner's 8 drives with the engine…</div></div>
<script src="../../engine/kta-engine.js"></script>
<script src="../../engine/kta-drive.js"></script>
<script src="../../engine/kta-car.js"></script>
<script src="../../app/i18n.js"></script>
<script src="../../app/i18n-drive.js"></script>
<script src="../../data/example-aug22-0903.js"></script>
<script src="../../data/example-aug22-0950.js"></script>
<script src="../../data/example-aug23-1959.js"></script>
<script src="../../data/example-aug23-2038.js"></script>
<script src="../../data/example-aug30-1529.js"></script>
<script src="../../data/example-aug30-1601.js"></script>
<script src="../../data/example-sep01-0813.js"></script>
<script src="../../data/example-sep05-0756.js"></script>
<script>
'use strict';
const K = window.KTA, F = K.fmt;
const IDS = ['aug22-0903', 'aug22-0950', 'aug23-1959', 'aug23-2038', 'aug30-1529', 'aug30-1601', 'sep01-0813', 'sep05-0756'];
const R = {};   // id → { log, rep (checkDrive), sum (car summary), name }
const n = (v, d) => (typeof v === 'number' && isFinite(v) ? F.num(v, d || 0) : '–');
const sg = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + n(Math.abs(v), d);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function nameOf(id) { const m = id.match(/(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)/); const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return DAY[d.getUTCDay()] + ' ' + (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[4] + ':' + m[5]; }
const VERD = { good: ['OK', 'v-good'], watch: ['Watch', 'v-watch'], stop: ['Stop', 'v-stop'] };
const pill = (s) => { const v = VERD[s] || ["Can't tell", 'v-none']; return `<span class="v ${v[1]}">${v[0]}</span>`; };
function check(rep, id) { for (const g of rep.an.gates) for (const c of g.checks) if (c.id === id) return c; return null; }
function decode(gz) {
  const bin = atob(gz), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
let MS = 0;
async function boot() {
  let car = K.carEmpty();
  for (const id of IDS) {
    const text = await decode(window.KTA_EXAMPLES[id].gz), t0 = performance.now();
    const log = K.readLog(text), out = K.carIngest(car, log, { fileName: window.KTA_EXAMPLES[id].name });
    MS += performance.now() - t0;
    car = out.state;
    R[id] = { log, rep: out.report.drive, sum: out.report.summary, name: nameOf(out.report.identity) };
  }
}
function trimSeries(log) {
  const out = [], bin = 20; let acc = [], start = 0;
  const flush = () => { if (acc.length > 3) { acc.sort((a, b) => a - b); out.push({ x: (start + bin / 2) / 60, y: acc[acc.length >> 1] }); } acc = []; };
  for (let i = 0; i < log.n; i++) {
    if (log.t[i] >= start + bin) { flush(); start = Math.floor(log.t[i] / bin) * bin; }
    const s = log.stft[i], l = log.ltft[i];
    if (isFinite(s) && isFinite(l) && log.rpm[i] > 600) acc.push(s + l);
  }
  flush(); return out;
}

// ---------------------------------------------------------------- charts
function lineChart({ series, yLo, yHi, xMax, xUnit, band, refs, h, yFmt }) {
  const w = 640; h = h || 200; const L = 46, Rr = 12, top = 12, bot = h - 26;
  const X = (x) => L + (x / xMax) * (w - L - Rr), Y = (y) => bot - ((y - yLo) / (yHi - yLo)) * (bot - top);
  const g = []; for (let i = 0; i <= 4; i++) { const y = yLo + (i * (yHi - yLo)) / 4; g.push(`<line x1="${L}" x2="${w - Rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(y) + 3}" text-anchor="end">${yFmt(y)}</text>`); }
  const xt = []; const st = xMax > 30 ? 10 : 5; for (let x = 0; x <= xMax; x += st) xt.push(`<text x="${X(x)}" y="${h - 8}" text-anchor="middle">${x}${xUnit}</text>`);
  const b = band ? `<rect x="${L}" y="${Y(band[1])}" width="${w - L - Rr}" height="${Y(band[0]) - Y(band[1])}" fill="var(--band)"/><text x="${w - Rr - 4}" y="${Y(band[1]) + 11}" text-anchor="end">${band[2]}</text>` : '';
  const r = (refs || []).map((f) => `<line x1="${L}" x2="${w - Rr}" y1="${Y(f.y)}" y2="${Y(f.y)}" stroke="var(--axis)" stroke-dasharray="4 3"/><text x="${w - Rr}" y="${Y(f.y) - 4}" text-anchor="end">${f.label}</text>`).join('');
  const s = series.map((q) => `<path d="${q.pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(Math.max(yLo, Math.min(yHi, p.y))).toFixed(1)).join(' ')}" fill="none" stroke="${q.color}" stroke-width="${q.wd || 2}" stroke-linejoin="round"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${b}${g.join('')}${r}${s}${xt.join('')}</svg>`;
}
/** One dot per drive against reference lines. Filled = the value, one hue; lines carry the meaning. */
function dotChart({ rows, lo, hi, refs, fmt, unit }) {
  const w = 640, rowH = 26, L = 150, Rr = 60, top = 18, h = top + rows.length * rowH + 22;
  const X = (v) => L + ((v - lo) / (hi - lo)) * (w - L - Rr);
  const lines = refs.map((f) => `<line x1="${X(f.v)}" x2="${X(f.v)}" y1="${top - 6}" y2="${h - 20}" stroke="${f.color || 'var(--axis)'}" stroke-dasharray="${f.dash ? '4 3' : '0'}"/><text x="${X(f.v)}" y="${h - 6}" text-anchor="middle">${f.label}</text>`).join('');
  const dots = rows.map((r, i) => { const y = top + i * rowH + rowH / 2; return `<text x="4" y="${y + 3}">${r.label}</text><line x1="${L}" x2="${w - Rr}" y1="${y}" y2="${y}" stroke="var(--grid)"/>` + (r.v == null ? `<text x="${L + 4}" y="${y + 3}">no pull in this drive</text>` : `<circle cx="${X(r.v)}" cy="${y}" r="5" fill="var(--meas)"/><text x="${w - Rr + 8}" y="${y + 3}">${fmt(r.v)}${unit}</text>`); }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${lines}${dots}</svg>`;
}
const legend = (items) => `<div class="legend">${items.map(([c, l]) => `<span><span class="sw" style="background:${c}"></span>${l}</span>`).join('')}</div>`;
const src = (label, url) => `<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`;

// ---------------------------------------------------------------- the six questions
const CASES = [];

CASES.push({ id: 'afr', q: 'My WOT AFR is 10.6. Is that wrong? Is it my E10? Should I pay for better fuel?', who: 'Starter Dual Target 21 PSI · E10 · TunerView on a phone', render() {
  const pulled = IDS.filter((id) => R[id].rep.ins.mix && R[id].rep.ins.mix.fullLoadAfr);
  const rows = IDS.map((id) => ({ label: R[id].name, v: R[id].rep.ins.mix ? R[id].rep.ins.mix.fullLoadAfr : null }));
  const vals = pulled.map((id) => R[id].rep.ins.mix.fullLoadAfr), kc = pulled.map((id) => R[id].sum.kcPeak);
  return {
    voice: `<blockquote>“My O2 air/fuel ratio completely escalated … The lowest numbers of the AFR were 10.6 … What went wrong? Could this be a result of the 90 octane E10 gasoline? Gasoline is very expensive where I live, should I upgrade?”<footer>Owner on the same KTuner map as you, using TunerView on an Android phone with no laptop · ${src('CivicX forum', 'https://www.civicx.com/forum/threads/question-about-the-right-fuel-octane-and-o2-afr-air-fuel-ratio-and-knock-control-for-the-ktuner-starter-dual-target-21-psi-tune.67784/')}</footer></blockquote>
      <blockquote>“It is running very rich at WOT. It hits even 9.5 … is my AFR just ok because European ECUs like running rich?”<footer>Starter 21, stock airbox · ${src('CivicX forum', 'https://www.civicx.com/forum/threads/running-rich-at-wot-how-to-adjust-afr.53529/')}</footer></blockquote>`,
    forum: `Volunteers said: “your AFR numbers are basically normal”; with E10 it's fine as long as full throttle doesn't go leaner than about 11.7–12; the 29 you see is fuel cut when you lift. “If you need to obsess on something, concentrate on knock control.” Good advice, but it took a thread, a volunteer, and screenshots, and nobody looked at the owner's whole drive.`,
    data: `<div class="card"><h3>Your full-throttle mixture, every drive with a pull</h3>
      ${dotChart({ rows, lo: 9.5, hi: 12.5, unit: ' AFR', fmt: (v) => n(v, 1), refs: [{ v: 11.0, label: 'your map asks 11.0', dash: true }, { v: 12.0, label: 'lean limit 12.0', color: 'var(--stop-ic)' }] })}
      <p>All ${pulled.length} drives with a pull ran ${n(Math.min(...vals), 1)}–${n(Math.max(...vals), 1)} AFR at full throttle. That is <b>richer</b> than your map's 11.0 and far from the 12.0 lean limit. Your ECU runs open loop at full throttle, so a little rich is the safe side.</p></div>`,
    answer: `<div class="big">Your AFR is safe. Don't touch the map and don't buy fuel to fix it.</div>
      <p>Rich by about ${n(11 - Math.max(...vals), 1)}–${n(11 - Math.min(...vals), 1)} AFR is protection, not a problem. E10 doesn't make you lean here: the sensor reads real lambda whatever the fuel.</p>
      <p><b>The number that does answer “is better fuel worth it” is knock control</b>: yours peaked at ${n(Math.min(...kc), 2)}–${n(Math.max(...kc), 2)} on these drives. If you want to try a higher-octane tank, the app compares the next similar drive's knock control and timing with this one, and tells you whether the extra money buys timing.</p>
      <div class="kt">KTuner: <b>no change</b>. WOT Enrich (L/H) stays at 11.0. The AFR command channel isn't in your logs yet: add it in TunerView, and the app can judge measured against commanded, cell by cell.</div>`,
    better: ["Answers from your whole history, not one screenshot", "Separates the scary-looking number (AFR) from the one that costs you power (knock control)", "Turns “should I pay for better fuel?” into a measured tank-to-tank test"]
  };
} });

CASES.push({ id: 'kc', q: 'My knock control went to 0.65. Am I hurting the engine? Can I still drive hard?', who: 'the question every KTuner owner asks once', render() {
  const r = R['aug30-1601'], I = r.rep.ins, tl = I.kc.timeline, f = R['aug30-1529'];
  const lugPts = tl.filter((q) => q.lug >= 0.25);
  const w = 640, h = 190, L = 46, Rr = 12, top = 12, bot = h - 26, tMax = tl[tl.length - 1].t / 60;
  const X = (m) => L + (m / tMax) * (w - L - Rr), Y = (v) => bot - ((v - 0.47) / (0.68 - 0.47)) * (bot - top);
  const svg = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${lugPts.map((q) => `<rect x="${X(q.t / 60)}" y="${top}" width="${X(5 / 60) - X(0) + 0.6}" height="${bot - top}" fill="var(--lug)" opacity=".3"/>`).join('')}
    <line x1="${L}" x2="${w - Rr}" y1="${Y(0.49)}" y2="${Y(0.49)}" stroke="var(--axis)" stroke-dasharray="4 3"/><text x="${w - Rr}" y="${Y(0.49) - 4}" text-anchor="end">0.49 = the best it reads</text>
    <text x="${L - 6}" y="${Y(0.65) + 3}" text-anchor="end">0.65</text><text x="${L - 6}" y="${Y(0.55) + 3}" text-anchor="end">0.55</text>
    <path d="${tl.map((q, i) => (i ? 'L' : 'M') + X(q.t / 60).toFixed(1) + ' ' + Y(q.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--meas)" stroke-width="2"/>
    ${[0, 10, 20, 30, 40, 50].map((m) => `<text x="${X(m)}" y="${h - 8}" text-anchor="middle">${m} min</text>`).join('')}</svg>`;
  return {
    voice: `<blockquote>“Is the engine at more risk of damage when it's high, or can we still drive hard?”<footer>${src('CivicX forum', 'https://www.civicx.com/forum/threads/driving-hard-with-high-kcon.79440/')}</footer></blockquote>
      <blockquote>“My knock control is higher than usual … I'm paranoid as hell.”<footer>${src('Civic 11 forum', 'https://www.civic11forum.com/threads/fuel-quality-and-knock-control.7390/')}</footer></blockquote>`,
    forum: `The answers: 0.49–0.53 is outstanding; up to about 0.70 is normal; “driving hard with something like 0.7 isn't going to damage your engine, it just limits the power and the fun”; “it is advisable to know <i>why</i> it is going higher”: heat, gas, a hill. Two traps owners fall into: knock control <b>starts at about 0.59 after every new flash</b> and drops with calm driving, and on the non-Si it <b>rises on purpose above about 5,200 rpm</b>. Neither is a problem.`,
    data: `<div class="card"><h3>${r.name}: 0.49 → ${n(I.kc.peak, 2)}, and when it rose</h3>${svg}${legend([['var(--meas)', 'knock control'], ['var(--lug)', 'lugging: 900–1,700 rpm with load']])}
      <p>It climbed in the orange stretches: the CVT holding about ${n(I.lug.rpm)} rpm with load in 35 °C traffic. Not one rise came above 5,200 rpm. At ${n(I.kc.peak, 2)} the ECU takes about <b>${n(10.2 * (I.kc.peak - 0.49), 1)}° of timing</b> under boost, everywhere: that's the flat feeling.</p>
      <p class="muted">${f.name} started at ${n(f.sum.kcStart, 2)} and fell to ${n(f.sum.kcEnd, 2)}: the “new flash starts high” pattern, not a fault. The app reads it that way instead of raising an alarm.</p></div>`,
    answer: `<div class="big">You're not hurting the engine. You're losing about ${n(10.2 * (I.kc.peak - 0.49), 1)}° of timing, and the cause is how you're driving in traffic, not your fuel.</div>
      <ul class="todo"><li>Below 60 km/h on hot days, use S (or a paddle) when you press past a third of the pedal. Keep 2,000 rpm or more when you ask for torque.</li><li>Don't floor it at 1,300–1,700 rpm: shift down first.</li><li>Next hot afternoon, same route: the app checks lugging under 4 % and knock control staying near 0.49.</li></ul>
      <div class="kt">KTuner: <b>no change</b>. A free habit comes first. Only if the habit is proven and it still climbs does the app offer one exact step: −2 psi in Boost Target Normal at 1,500–1,700 rpm.</div>`,
    better: ["Says why it rose (when, rpm, load), not just that it's high", "Knows this car's quirks: 0.59 after a flash, the rise above 5,200 rpm", "Puts the number in degrees you can feel, and gives one free fix with a proof"]
  };
} });

CASES.push({ id: 'heat', q: 'This car is completely different in the heat. Will an intake fix it?', who: 'hot-climate owners, every summer', render() {
  const a = R['aug30-1529'], b = R['aug30-1601'];
  const row = (label, va, vb, d, unit) => `<tr><td>${label}</td><td class="n">${n(va, d)}${unit}</td><td class="n">${n(vb, d)}${unit}</td></tr>`;
  return {
    voice: `<blockquote>“90–100 °F, this car is not pulling me hard at all, boost levels drop down to ~15 psi … if I'm idling in a parking lot and it's hot outside, the car will severely cut your boost to like 13 psi.”<footer>${src('CivicX forum', 'https://www.civicx.com/forum/threads/this-car-is-completely-different-in-high-temps.41311/')}</footer></blockquote>
      <blockquote>“When running the AC for a bit, there is a noticeable loss of power … I was thinking the cold air intake may help.”<footer>${src('CivicX forum', 'https://www.civicx.com/forum/threads/power-loss-using-ac.25748/')}</footer></blockquote>`,
    forum: `The answers: every turbo car loses power in hot, humid weather; idling soaks the intercooler; the AC is correlation, not the cause. Some suggest a bigger intercooler or methanol injection, and one KTuner trick changes the IAT ignition correction on unlocked maps. Nobody can tell the owner how much <i>their</i> car loses, or what <i>their</i> heat soak looks like.`,
    data: `<div class="card"><h3>Your car, the same afternoon, 31 minutes apart</h3><div class="scroll-x"><table class="t"><thead><tr><th></th><th>${a.name}</th><th>${b.name} (after traffic)</th></tr></thead><tbody>

      ${row('Best 50→70 km/h', a.sum.accel5070 && a.sum.accel5070.seconds, b.sum.accel5070 && b.sum.accel5070.seconds, 2, ' s')}
      ${row('Knock control peak', a.sum.kcPeak, b.sum.kcPeak, 2, '')}
      ${row('CVT fluid peak', a.sum.cvtPeak, b.sum.cvtPeak, 0, ' °C')}</tbody></table></div>
      <p>Same car, same map, same day. After traffic the intake was ${n(b.rep.ins.boost.pullIat - a.rep.ins.boost.pullIat)} °C hotter at the start of a pull, the ECU asked for less boost, and 50→70 took ${n(b.sum.accel5070.seconds - a.sum.accel5070.seconds, 2)} s longer. On a cool morning (${R['sep01-0813'].name}) pulls started at ${n(R['sep01-0813'].rep.ins.boost.pullIat)} °C.</p></div>`,
    answer: `<div class="big">Nothing is broken. It's heat soak, and an intake won't fix it.</div>
      <p>Under boost your intake air after the intercooler runs only 2–6 °C above the air going into the turbo, so the intercooler isn't the bottleneck. The heat comes from standing still: idling soaks everything.</p>
      <ul class="todo"><li>Before a hard pull, drive 1–2 minutes at steady speed until intake air is under 48 °C.</li><li>No pulls straight out of a traffic light queue or a car park.</li><li>On very hot days ECO already runs your 18 psi targets: use it in traffic.</li></ul>
      <div class="kt">KTuner: <b>no change</b>. The IAT ignition trick changes ignition timing: the app never edits ignition. It's a job for a tuner with a dyno.</div>`,

} });

CASES.push({ id: 'trims', q: 'I installed an intake. Are my fuel trims OK? Do I need a tune?', who: 'PRL, 27WON and other intake owners', render() {
  const a = R['aug23-1959'], b = R['aug23-2038'], ta = trimSeries(a.log), tb = trimSeries(b.log);
  const xMax = Math.ceil(Math.max(ta[ta.length - 1].x, tb[tb.length - 1].x) / 5) * 5;
  const normal = IDS.filter((id) => id !== 'aug23-2038').map((id) => R[id].sum.trimWorst);
  return {
    voice: `<blockquote>“I'm probably being paranoid about my fuel trims after installing the PRL intercooler kit. I see high STFT (+5–19) at idle sometimes, but otherwise it looks okay?”<footer>${src('CivicX forum', 'https://www.civicx.com/forum/threads/fuel-trim-review-im-paranoid-and-need-you-guys-%E2%9D%A4.42301/')}</footer></blockquote>
      <blockquote>“The question I get asked the most is: what should my fuel trims be?”<footer>27WON, on intakes · ${src('CivicXI forum', 'https://www.civicxi.com/forum/threads/cais-and-fuel-trims.23884/')}</footer></blockquote>`,
    forum: `What's true: PRL says its High Volume Intake uses a one-piece MAF housing “delivering proper fuel trims” with no tune; 27WON shows trims within ±1.5 % of stock on the same route; Phearable asks which MAF housing you have (Stock, Other Stock Size, PRL HVI Street) before it builds a tune. In KTuner the choice lives in <b>MAF Scaling</b> (Factory, Factory w/ scaled top end, and the race-housing curves). What owners can't easily tell: is +10 % at idle normal (cold air, ethanol) or a leak, and is −20 % a wrong setting?`,
    data: `<div class="card"><h3>Your trims: normal is ${n(Math.min(...normal), 1)} to ${sg(Math.max(...normal), 1)} %. One evening it wasn't.</h3>
      ${lineChart({ series: [{ pts: ta, color: 'var(--axis)', wd: 1.5 }, { pts: tb, color: 'var(--meas)' }], yLo: -30, yHi: 10, xMax, xUnit: ' min', band: [-5, 5, 'normal ±5 %'], yFmt: (v) => sg(Math.round(v), 0) + '%' })}
      ${legend([['var(--axis)', a.name], ['var(--meas)', b.name + ', after a change']])}
      <p>On ${b.name} the ECU pulled ${n(Math.abs(b.sum.trimWorst), 1)} % of the fuel in every load band <b>from the first minute</b>, right after something changed since ${a.name}. A leak would push trims <i>up</i> (positive). Off everywhere from cold means the ECU is measuring the air wrong: the MAF Scaling setting doesn't match the housing.</p></div>`,
    answer: `<div class="big">Your trims are fine on every drive but one. That one was a MAF Scaling setting, not the intake.</div>
      <ul class="todo"><li>Within ±5 %: leave it. A few % up at idle on a cool day is normal (colder air), and so is a few % up on a fuel with more ethanol.</li><li>Positive and climbing at idle and low speed only: look for a leak after the MAF (clamps, couplers). Not a map job.</li><li>Off by 15 % or more everywhere from the first minute, after a change: go back to the file you had before. Then set MAF Scaling to the option for <i>your</i> housing. The app asks which intake you have instead of guessing.</li></ul>
      <div class="kt">KTuner: <b>MAF Scaling → the option that matches your housing</b>. Nothing else: never bend the curve or change WOT targets to cancel a trim error. Proof: 10 calm minutes with trims within ±5 %. Your next drive, ${R['aug30-1529'].name}, was back at ${sg(R['aug30-1529'].sum.trimWorst, 1)} %.</div>`,
    better: ["Tells normal (cold air, ethanol) from a leak from a wrong setting, by the shape of the trims", "Remembers what changed and when, so the cause is obvious", "One exact place in KTuner, and a proof"]
  };
} });

CASES.push({ id: 'dp', q: 'Downpipe: will I get a check engine light? Can I turn it off and still pass inspection?', who: 'every downpipe buyer', render() {

      <p>The app looks for revs jumping without speed under boost, which is what a slipping belt does, and found none. CVT fluid stays at ${n(R['sep01-0813'].sum.cvtPeak)}–${n(R['sep05-0756'].sum.cvtPeak)} °C on cool mornings and peaks at ${n(R['aug30-1601'].sum.cvtPeak)} °C in hot traffic.</p></div>`,

  document.getElementById('app').innerHTML = `
  <header class="hero wrap">
    <div class="eyebrow">Civic FE 1.5T CVT · KTuner Starter 21 Dual Tune 2 · E10 RON95 · Vietnam</div>

      <div class="card"><div class="eyebrow">How owners get help today</div>

        <blockquote>“Post a datalog … someone will read it for you and let you know if something looks off.”<footer>${src('CivicX forum', 'https://www.civicx.com/forum/threads/make-low-boost-until-4k-rpm-feel-weird-help.94759/')}</footer></blockquote>
        <p class="muted">Then wait for a volunteer, who sees one screenshot and none of your history.</p></div>
      <div class="card"><div class="eyebrow">What this does instead</div>

        <p><b>It won't</b> add power your turbo doesn't have, edit ignition or knock settings, or call the weather a tune.</p></div>

  </header>
  <main class="wrap">
    <section class="step"><div class="eyebrow">1 · The question, in owners' words</div><h2>${esc(c.q)}</h2>${v.voice}</section>

    <section class="step"><div class="eyebrow">5 · Why this beats asking the forum</div><ul class="better">${v.better.map((b) => `<li>${b}</li>`).join('')}</ul></section>
  </main>
  <footer class="page wrap muted">Prototype · quotes from public forum threads (links above), summarised in docs/research/owner-voices.md · every number comes from the real engine on this owner's 8 drives, live.</footer>`;
  document.querySelectorAll('.q').forEach((b) => b.addEventListener('click', () => {
    const j = +b.dataset.i; const url = new URL(location); url.searchParams.set('q', CASES[j].id); history.replaceState(null, '', url);

  }));
}
boot().then(() => render(Math.max(0, CASES.findIndex((c) => c.id === new URLSearchParams(location.search).get('q')))),
  (e) => { document.getElementById('app').innerHTML = `<div class="boot">Could not read the drives: ${esc(e.message)}</div>`; });
</script>
