<title>Next Step Loop</title>
<!-- Throwaway prototype. The owner's 9 real TunerView uploads, replayed in order through the real engine.
     After each upload the assistant closes the last ask with numbers and gives ONE next step:
     change in KTuner, watch in TunerView, a drive to log, or nothing. Nothing in the app imports this. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Chakra+Petch:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
:root {
  --paper: #EDF0F2; --sheet: #FFFFFF; --sheet-2: #F6F8F9; --sheet-3: #EEF2F5;
  --ink: #111B24; --ink-2: #3D4955; --ink-3: #5B6874; --line: #D5DCE2; --line-2: #E6EBEF;
  --accent: #2450C8; --accent-tint: #E8EEFB; --accent-text: #2450C8; --accent-line: #AFC3EE;
  --good-bg: #E5F3E8; --good-fg: #1C6B32; --watch-bg: #FFF2D2; --watch-fg: #6E4A00;
  --stop-bg: #FCE3DF; --stop-fg: #8F2216; --none-bg: #EDF1F4; --none-fg: #45515C;
  --font-d: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-b: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1317; --sheet: #151C22; --sheet-2: #1A2229; --sheet-3: #202932;
    --ink: #E7ECF0; --ink-2: #B6C0C9; --ink-3: #93A0AC; --line: #2A343D; --line-2: #222B33;
    --accent: #7D9CF6; --accent-tint: #1D2947; --accent-text: #A9BEFA; --accent-line: #3B5190;
    --good-bg: #15301E; --good-fg: #93D9A6; --watch-bg: #372B0D; --watch-fg: #F2CB6B;
    --stop-bg: #3B1B17; --stop-fg: #F5A698; --none-bg: #212A32; --none-fg: #B6C0C9;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-b); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent-text); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { font-family: var(--font-d); margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; line-height: 1.2; } h2 { font-size: 19px; line-height: 1.3; } h3 { font-size: 15px; }
p { margin: 8px 0 0; color: var(--ink-2); }
.eyebrow { font: 600 12px/1.4 var(--font-b); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.muted { color: var(--ink-3); font-size: 13px; }
header.hero { padding: 28px 0 8px; }
.ways { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
@media (max-width: 760px) { .ways { grid-template-columns: 1fr; } }
.ways .card p { font-size: 14px; }
.ways .ours { border: 2px solid var(--accent-line); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; margin-top: 18px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }
.side { position: sticky; top: 12px; }
@media (max-width: 860px) { .side { position: static; } }
.thread { display: flex; flex-direction: column; gap: 14px; }
.up { align-self: flex-end; max-width: 100%; background: var(--accent-tint); border: 1px solid var(--accent-line); border-radius: 12px 12px 2px 12px; padding: 8px 12px; font: 13px/1.4 var(--font-m); overflow-wrap: anywhere; }
.up b { font-family: var(--font-b); }
.reply { border-radius: 12px 12px 12px 2px; }
.reply .say { font: 700 17px/1.35 var(--font-d); color: var(--ink); margin-top: 6px; }
.close { margin-top: 12px; border-top: 1px solid var(--line-2); padding-top: 10px; }

.close .row .v { flex: none; }
.step { margin-top: 12px; border: 2px solid var(--accent-line); border-radius: 10px; padding: 12px 14px; }
.step.same { border-style: dashed; border-width: 1px; }
.tag { display: inline-block; font: 700 11px/18px var(--font-d); letter-spacing: .05em; text-transform: uppercase; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--sheet); }
.tag.drive { background: var(--ink-2); } .tag.none { background: var(--none-bg); color: var(--none-fg); }
.step h3 { margin-top: 6px; font-size: 16px; }
.step ol, .step ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.step li + li { margin-top: 3px; }
.kt { margin-top: 10px; background: var(--sheet-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

.when b { color: var(--ink-2); }
table.g { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
table.g th, table.g td { text-align: left; padding: 6px 6px; border-top: 1px solid var(--line-2); vertical-align: top; }
table.g th { font: 600 11.5px var(--font-b); color: var(--ink-3); border-top: 0; }

.scroll-x { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 10px; }

.tile b { display: block; font: 600 16px/1.2 var(--font-m); font-variant-numeric: tabular-nums; }
.tile span { font-size: 11.5px; color: var(--ink-3); }
.v { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font: 700 12px/20px var(--font-d); white-space: nowrap; }
.v::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.v-good { background: var(--good-bg); color: var(--good-fg); } .v-watch { background: var(--watch-bg); color: var(--watch-fg); }
.v-stop { background: var(--stop-bg); color: var(--stop-fg); } .v-none { background: var(--none-bg); color: var(--none-fg); }
.asks { list-style: none; margin: 10px 0 0; padding: 0; }
.asks li { padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.asks li:first-child { border-top: 0; }
.asks li b { display: block; color: var(--ink); font-weight: 600; }
.asks li span.why { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--sheet); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent-text); }
.btn[disabled] { opacity: .45; cursor: default; }
.qbox { margin-top: 12px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.qbox.open { background: var(--sheet-2); border: 0; border-radius: 10px; padding: 10px 12px; }
.qbox p { margin: 0; color: var(--ink); }
.qbox .up.mine { display: inline-block; margin-top: 8px; font-family: var(--font-b); font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.opt { cursor: pointer; border: 1px solid var(--accent-line); background: var(--sheet); color: var(--accent-text); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.opt:hover { border-color: var(--accent); }
.link { cursor: pointer; border: 0; background: none; padding: 0 0 0 6px; color: var(--accent-text); text-decoration: underline; font-size: 13px; }

footer.page { padding: 28px 0 48px; }
.boot { padding: 80px 16px; text-align: center; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<body>
<div id="app"><div class="boot">Reading the owner's 9 uploads with the engine…</div></div>
<script src="../../engine/kta-engine.js"></script>
<script src="../../engine/kta-drive.js"></script>
<script src="../../engine/kta-car.js"></script>
<script src="../../data/ktuner-map.js"></script>
<script src="../../data/example-aug22-0903.js"></script>
<script src="../../data/example-aug22-0950.js"></script>
<script src="../../data/example-aug23-1959.js"></script>
<script src="../../data/example-aug23-2038.js"></script>
<script src="../../data/example-aug30-1509.js"></script>
<script src="../../data/example-aug30-1529.js"></script>
<script src="../../data/example-aug30-1601.js"></script>
<script src="../../data/example-sep01-0813.js"></script>
<script src="../../data/example-sep05-0756.js"></script>
<script>
'use strict';
const K = window.KTA, L = K.LIMITS;
const IDS = ['aug22-0903', 'aug22-0950', 'aug23-1959', 'aug23-2038', 'aug30-1509', 'aug30-1529', 'aug30-1601', 'sep01-0813', 'sep05-0756'];
const n = (v, d) => (typeof v === 'number' && isFinite(v) ? v.toFixed(d || 0) : '–');
const sg = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + n(Math.abs(v), d);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function nameOf(file) { const m = file.match(/(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)/); const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return DAY[d.getUTCDay()] + ' ' + (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[4] + ':' + m[5]; }
const PILL = { good: ['OK', 'v-good'], watch: ['Watch', 'v-watch'], stop: ['Stop', 'v-stop'], done: ['Done', 'v-good'], open: ['Not yet', 'v-watch'], wait: ["Can't tell yet", 'v-none'], fail: ['Still off', 'v-stop'], you: ['Waiting for you', 'v-watch'] };
const pill = (s) => { const v = PILL[s] || ["Can't tell", 'v-none']; return `<span class="v ${v[1]}">${v[0]}</span>`; };
const tile = (v, label) => `<div class="tile"><b>${v}</b><span>${label}</span></div>`;
function decode(gz) {
  const bin = atob(gz), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

// ---------------------------------------------------------------- what the owner watches live
// TunerView gauge names exactly as the owner's log header spells them. Thresholds come from KTA.LIMITS.
const KC_OK = 0.55, KC_NORMAL = 0.70, COOL = 42, PULL_IAT = 48, LEAN_MAX = L.mixture.target + L.mixture.stopLean;
const G = {
  trims: ['STFT B1 + LTFT B1', `within ±${L.trim.good} %`, `beyond ±${L.trim.watch} %`, 'Stop pulling. Drive home calm, upload.'],
  kc: ['Knock Control', `≤ ${KC_OK}`, `above ${n(KC_NORMAL, 2)}`, `Ease off, note what you were doing (rpm, heat, hill). Up to ${n(KC_NORMAL, 2)} costs timing, not damage.`],
  iat: ['IAT2', `under ${COOL} °C moving, under ${PULL_IAT} °C when a pull starts`, `over ${PULL_IAT} °C`, 'Hold steady speed 1–2 min before the pull. A hot pull is not a test.'],
  afr: ['O2 (AFR) at full throttle', `${n(L.mixture.target - 1, 1)}–${n(L.mixture.target + 0.5, 1)}`, `leaner than ${n(LEAN_MAX, 1)}`, 'Lift. Upload before the next pull.'],
  boost: ['Turbo Pressure vs Target', `within +${L.overshoot.good} psi`, `more than +${L.overshoot.watch} psi held`, 'Upload. A held overshoot is the only reason to touch boost.'],
  rpm: ['Engine RPM when you press past ⅓ pedal', '2,000 rpm or more', 'under 1,700 rpm', 'Use S or a paddle below 60 km/h.'],
  live: ['Turbo Pressure, DIFP, Transmission Temperature', 'move as you drive', 'stuck on one number', 'Remove and re-add that gauge in TunerView, then start the log again.']
};
const gauges = (keys) => `<div class="scroll-x"><table class="g"><thead><tr><th>Gauge in TunerView</th><th>OK</th><th>If you see</th><th>Then</th></tr></thead><tbody>${keys.map((k) => `<tr>${G[k].map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

// ---------------------------------------------------------------- asks: what one upload asked the next one to prove
// Each judge reads only the engine's summary of the new upload. 'wait' = this drive can't answer it (never counts as a fail).
const ASK = {
  undo: { title: 'Undo: trims back within ±5 %', judge(s) {
    if (!s) return ['wait', 'Too short to judge: needs 10 calm minutes.'];
    if (Math.abs(s.trimWorst) <= L.trim.good && s.calmSec >= 600) return ['done', `Trims ${sg(s.trimWorst, 1)} % over ${Math.round(s.calmSec / 60)} calm minutes (were −21.4 %).`];
    if (Math.abs(s.trimWorst) > L.trim.watch) return ['fail', `Trims still ${sg(s.trimWorst, 1)} %.`];
    return ['open', `Trims ${sg(s.trimWorst, 1)} %, ${Math.round(s.calmSec / 60)} calm min: not enough yet.`];
  } },
  baseline: { title: 'Baseline: one cool drive with 2 pulls', judge(s) {
    if (!s) return ['wait', 'Too short.'];
    if (s.cool && s.hardPulls >= 2) return ['done', `Intake ${n(s.iatMoving)} °C, ${s.hardPulls} pulls, 50→70 km/h ${n(s.accel5070 && s.accel5070.seconds, 2)} s. Every later drive is compared to this one.`];
    return ['wait', !s.cool ? `Intake ${n(s.iatMoving)} °C moving: not a cool drive.` : `Cool (${n(s.iatMoving)} °C) but ${s.hardPulls} pulls.`];
  } },
  habit: { title: 'Habit test: revs up in hot traffic', judge(s, I) {
    if (!s) return ['wait', 'Too short.'];
    if (!s.hot) return ['wait', `Cool drive (${n(s.iatMoving)} °C): the habit only shows on a hot afternoon.`];
    const rise = s.kcPeak - s.kcStart;
    if (s.lugShare < 4 && rise <= 0.03) return ['done', `Lugging ${n(s.lugShare, 1)} % of moving time, Knock Control ${n(s.kcStart, 2)} → ${n(s.kcPeak, 2)}.`];
    return ['open', `Lugging ${n(s.lugShare, 1)} %, Knock Control rose ${n(rise, 2)}.`];
  } },
  channels: { title: 'Log AFR Command and MAF Hz', judge(s) {
    if (!s) return ['wait', 'Too short.'];
    return s.missing && s.missing.length ? ['wait', 'Still not in the log. Mixture is judged against the map\'s 11.0, not what the ECU asked.'] : ['done', 'Both in the log now.'];
  } },
  logger: { title: 'Fix the logger: dead gauges', judge(s) {
    if (!s) return ['wait', 'Too short.'];
    return s.flat && s.flat.length ? ['fail', `Still flat: ${s.flat.map(chName).join(', ')}.`] : ['done', 'Every gauge moves again.'];
  } }
};
const CH = { boost: 'Turbo Pressure', boostTarget: 'Turbo Pressure Target', fp: 'DIFP', fpTarget: 'DIFP Target', cvt: 'Transmission Temperature', stft: 'STFT B1', ltft: 'LTFT B1', kControl: 'Knock Control', lam: 'O2', lamCmd: 'AFR Command' };
const chName = (k) => CH[k] || k;

// ---------------------------------------------------------------- one upload in, one next step out
// A tuner's order: an open Stop first, then "this log can't be read", then a dead logger, then a cause seen
// in this drive, then the baseline every proof needs, then nothing. Only the engine's Flash plan names a
// KTuner table (plan.headline); this function never writes a cell.
function nextStep(u, open, plan) {
  const s = u.sum, I = u.ins;
  if (u.verdict === 'stop' && s && Math.abs(s.trimWorst) > L.trim.watch) return {
    kind: 'change', opens: 'undo', title: 'Put the map from before back on the car',
    body: `<p>Trims pulled ${n(Math.abs(s.trimWorst), 1)} % in every load band from the first minute. ${u.prev ? u.prev.name + ' was ' + sg(u.prev.sum.trimWorst, 1) + ' %.' : ''} Off by the same amount everywhere, right after a change, is the air reading (MAF Scaling), not fuel and not knock.</p>
      <ol><li>Flash ${plan.undoName && !/not recorded/.test(plan.undoName) ? `<b>${esc(plan.undoName.replace(/^Flash /, ''))}</b>` : `the file you ran at ${u.prev ? u.prev.name : 'your last good drive'} (answer “which map” on your first upload and I can name it)`}. Save today's as <b>…-2038-bad</b> so nothing is lost.</li>
      <li><b>MAF Scaling</b> must match the intake housing: that's the only setting that moves trims this way. ${ANSWERS.housing ? (FIT[ANSWERS.housing][0] ? 'The KTuner box below shows which option.' : 'Not sure is fine: stay on the Undo file for now.') : 'Answer the housing question above and the KTuner box shows which option.'}</li>
      <li>Next drive: calm, no pulls, at least 10 minutes.</li></ol>
      <p class="muted">Not this: bending the AFM curve or richening WOT to cancel −21 %. Neither touches the cause.</p>`,
    watch: ['trims', 'kc'], proves: 'trims back within ±5 % after 10 calm minutes', when: 'after the first calm drive on the old file'
  };
  if (!s) return { kind: 'none', same: true, title: 'Nothing read: the drive was too short', body: `<p>Under a minute moving. I keep your history clean and don't judge it.</p>`, when: 'after a drive of 10 minutes or more' };
  if (s.flat && s.flat.length) return {
    kind: 'watch', opens: 'logger', title: `Your logger recorded ${s.flat.length} dead gauges`,
    body: `<p>${s.flat.map(chName).join(', ')} sat on one number the whole drive while the revs moved. The car is fine; the log isn't. Without boost in the log I can't check the next pull, and the habit test can't be scored.</p>
      <ol><li>Open TunerView before you drive and check the gauges below move when you blip the throttle.</li><li>If one is stuck: remove it from the gauge list, add it back, restart logging.</li></ol>`,
    watch: ['live'], proves: 'every gauge moves', when: 'your next drive, any kind'
  };
  // The habit cause (Knock Control climbing while lugging on a hot drive). Seen before the baseline exists, it is
  // tracked and the free habit starts now, but the baseline stays the step: the habit is scored against it.
  const habitSeen = I && I.kc && s.hot && s.kcPeak - s.kcStart >= 0.08 && I.kc.lugUpSteps * 2 > I.kc.upSteps;
  const habitWhy = habitSeen ? `Knock Control went ${n(s.kcStart, 2)} → ${n(s.kcPeak, 2)}: about ${n(L.score.tableDeg * (s.kcPeak - L.score.baseline), 1)}° of timing taken under boost. Not damage. ${I.kc.lugUpSteps} of its ${I.kc.upSteps} steps up came while the CVT held ${n(I.lug.rpm)} rpm with load in ${n(s.iatMoving)} °C air. None came above 5,200 rpm.` : '';
  const habitDo = '<li>Below 60 km/h, put it in S (or tap a paddle) before pressing past a third of the pedal.</li><li>No pulls out of traffic or a car park: steady speed 1–2 min first.</li>';
  if (!open.baseline || open.baseline.status !== 'done') return {
    kind: 'drive', opens: 'baseline', also: habitSeen ? 'habit' : null, title: 'Log one cool-morning drive with 2 pulls',
    body: `<p>Every “did it work?” needs a drive to compare against. Heat changes boost, timing and 50→70 times on its own, so the baseline must be cool.</p>
      <ol><li>Before 8 am, or after an hour parked in shade. Intake under ${COOL} °C.</li><li>10 minutes normal driving first (engine and CVT warm).</li><li>Two pulls in S, 50 → 100 km/h, on a straight safe road, a minute apart.</li>
      ${s.missing && s.missing.length ? `<li>While you're in TunerView: add <b>AFR Command</b> and <b>MAF Hz</b> to the logged list if your app offers them. Without AFR Command I judge the mixture against the map's 11.0, not what the ECU asked for.</li>` : ''}</ol>
      ${habitSeen ? `<p><b>Also seen today:</b> ${habitWhy} Start this free habit now; I score it on a hot afternoon once the baseline is in.</p><ol>${habitDo}</ol>` : ''}`,
    watch: ['iat', 'kc', 'afr', 'boost'], proves: 'a cool drive with 2 pulls to measure every change against', when: 'after that morning drive'
  };
  if (habitSeen) return {
    kind: 'drive', opens: 'habit', title: 'Keep the revs up in hot traffic (free, no flash)',
    body: `<p>${habitWhy}</p><ol>${habitDo}<li>Log your next <b>hot afternoon</b> drive, same kind of traffic.</li></ol>`,
    watch: ['rpm', 'kc', 'iat'], proves: `lugging under 4 % of moving time and Knock Control not rising (today ${n(s.lugShare, 1)} %, +${n(s.kcPeak - s.kcStart, 2)})`, when: 'after your next hot-afternoon drive',
    ktNote: 'Only if the habit is done and it still climbs while lugging does the Flash plan open a boost step for 1,500–1,700 rpm.'
  };
  if (open.habit && open.habit.status !== 'done') return {
    kind: 'drive', opens: 'habit', title: 'Habit test: log your next hot-afternoon drive', when: 'after your next hot-afternoon drive',
    body: `<p>The baseline is in. Keep the habit going; the next hot afternoon scores it against the baseline.</p><ol>${habitDo}</ol>`,
    watch: ['rpm', 'kc', 'iat'], proves: 'lugging under 4 % of moving time and Knock Control not rising',
    ktNote: 'Only if the habit is done and it still climbs while lugging does the Flash plan open a boost step for 1,500–1,700 rpm.'
  };
  return {
    kind: 'none', title: 'Nothing to change. Drive it.',
    body: '<p>Upload after: any flash, any part, a new fuel brand, or Knock Control over 0.60 on the gauge.</p>', when: 'something changes'
  };
}

// ---------------------------------------------------------------- the reassurance line: answer "am I hurting it?" first
function verdictLine(u) {
  const s = u.sum;
  if (!s) return 'Too short to read. Nothing wrong, nothing learned.';
  if (u.verdict === 'stop') return 'Stop driving hard. Not broken: the map is reading the air wrong.';
  const bits = [];
  if (s.mixLeanest != null) bits.push(`full-throttle AFR ${n(s.mixLeanest, 1)} (map asks ${n(s.mixTarget, 1)}, lean limit ${n(LEAN_MAX, 1)}): safe`);
  bits.push(`Knock Control peak ${n(s.kcPeak, 2)}${s.kcPeak <= 0.53 ? ': outstanding' : s.kcPeak <= KC_NORMAL ? ': costs timing, not damage' : ''}`);
  bits.push(`trims ${sg(s.trimWorst, 1)} %`);
  if (s.kcStart >= 0.56 && s.kcEnd <= 0.51) bits.push(`Knock Control started at ${n(s.kcStart, 2)} and settled: the normal pattern after a fresh flash`);
  return (u.verdict === 'good' ? 'Engine healthy. ' : 'Nothing broken. ') + bits.join('; ') + '.';
}

// ---------------------------------------------------------------- owner answers
// Each answer goes into the Car history through the engine's own API (carRecordFlash / carAnswer), applied
// before or after the upload it belongs to, so the Flash plan, the Shakedown and the verdicts react to it.
// The housing answer is a fitment fact: it only resolves the plan's own "pick the right preset" route.
const MAPNAME = window.KTA_MAP.name;
const flash = (car, start, map, changed, note) => K.carRecordFlash(car, { time: start - 60000, map, changed, note: note || '' }).state;
const QS = {
  map: { at: 'aug22-0903', short: 'Which map is on the car?', show: () => true,
    q: () => `Which map is on the car? Your map file says <b>${esc(MAPNAME)}</b>. I record it, so an Undo can name the file.`,
    opts: {
      starter: { label: 'That one', before: 'aug22-0903', fn: (car, c) => flash(car, c.start, MAPNAME, 'other', 'On the car at the first upload') },
      other: { label: 'Something else', reply: 'Then send me that map file. Until then I compare drives only with each other.' } } },
  changed: { at: 'aug23-2038', short: 'What changed after 19:59?', show: (u) => u.verdict === 'stop',
    q: (u) => `What changed between ${u.prev ? u.prev.name : 'your last drive'} and this drive?`,
    opts: {
      afm: { label: 'I flashed: changed MAF Scaling', before: 'aug23-2038', fn: (car, c) => flash(car, c.start, 'Starter 21 · MAF Scaling changed', 'afm') },
      flash: { label: 'I flashed something else', before: 'aug23-2038', fn: (car, c) => flash(car, c.start, 'Starter 21 · edited', 'other') },
      part: { label: 'Fitted a part, no flash', after: 'aug23-2038', fn: (car, c) => K.carAnswer(car, c.id, 'neither') },
      none: { label: 'Nothing I know of', after: 'aug23-2038', fn: (car, c) => K.carAnswer(car, c.id, 'neither') } } },
  housing: { at: 'aug23-2038', short: 'Which intake housing is fitted?', show: (u) => u.plan.route === 'preset',
    q: () => 'Which intake housing is fitted? MAF Scaling has to match it.',
    opts: { factory: { label: 'Factory airbox' }, hvi: { label: 'PRL HVI' }, race: { label: 'PRL Race housing' }, won: { label: '27WON Race' }, unsure: { label: 'Not sure' } } },
  undo: { at: 'aug30-1529', short: 'Did you flash before this drive?',
    show: (u) => u.sum && u.sum.kcStart >= 0.56 && u.sum.kcEnd <= 0.51 && U.some((p) => p.verdict === 'stop'),
    q: (u) => `Knock Control started at ${n(u.sum.kcStart, 2)} and settled: that's what a fresh flash does. Did you flash after the Stop?`,
    opts: {
      undo: { label: 'Yes: the old file back (Undo)', before: 'aug30-1509', fn: (car, c) => flash(car, c.start, (c.lastPlan && c.lastPlan.prefill && c.lastPlan.prefill.map) || MAPNAME, 'afm', 'Undo after the 23 Aug 20:38 Stop') },
      other: { label: 'Yes: a different file', before: 'aug30-1509', fn: (car, c) => flash(car, c.start, 'Starter 21 · new file', 'other') },
      no: { label: 'No' } } }
};
// MAF Scaling option per housing: the options in the owner's map file (Factory, PRL Race, 27Won Race, Custom).
const FIT = {
  factory: ['Factory', 'Factory airbox, factory AFM housing.'],
  hvi: ['Factory', 'PRL says the HVI gives proper trims with no tune. Not assumed: the calm drive must show trims within ±5 %.'],
  race: ['PRL Race', 'The PRL Race housing is larger than factory; its curve is in your file.'],
  won: ['27Won Race', 'The 27WON Race housing has its own curve in your file.'],
  unsure: [null, 'Stay on the Undo file. Check the housing (receipt, or the label on it) before you change MAF Scaling again.']
};
let ANSWERS = {};

// ---------------------------------------------------------------- replay
const U = [], TEXT = {};
async function boot() {
  for (const id of IDS) TEXT[id] = await decode(window.KTA_EXAMPLES[id].gz);
  replay();
}
function replay() {
  U.length = 0;
  let car = K.carEmpty(), lastPlan = null;
  const apply = (when, id, c) => Object.keys(ANSWERS).forEach((q) => {
    const o = QS[q].opts[ANSWERS[q]];
    if (o && o.fn && o[when] === id) car = o.fn(car, c);
  });
  for (const id of IDS) {
    const ex = window.KTA_EXAMPLES[id], log = K.readLog(TEXT[id]);
    apply('before', id, { start: K.carIdentity(log, { fileName: ex.name }).start, lastPlan });
    const out = K.carIngest(car, log, { fileName: ex.name });
    car = out.state;
    const r = out.report, sum = r.tooShort ? null : r.summary;
    if (sum) apply('after', id, { id: sum.id });
    lastPlan = K.carFlashPlan(car, window.KTA_MAP, {});
    U.push({ id, file: ex.name, name: nameOf(ex.name), verdict: r.tooShort ? 'none' : r.verdict, sum, ins: r.drive && r.drive.ins, plan: lastPlan });
  }
  // the loop: every upload judges the open asks, then gives one step
  const open = {};
  let last = null;
  U.forEach((u, i) => {
    u.prev = [...U.slice(0, i)].reverse().find((p) => p.sum) || null;
    u.closed = Object.keys(open).filter((k) => open[k].status !== 'done').map((k) => {
      const [status, why] = ASK[k].judge(u.sum, u.ins); open[k].status = status; open[k].why = why;
      if (status === 'done') open[k].doneAt = u.name;
      return { k, status, why };
    });
    u.step = nextStep(u, open, u.plan);
    u.step.same = u.step.same || (!u.step.also && last && last.opens && last.opens === u.step.opens);
    [u.step.opens, u.step.also].forEach((k) => { if (k && !open[k]) open[k] = { status: 'open', why: 'Asked on ' + u.name + '.', at: u.name }; });
    if (u.sum && u.sum.missing && u.sum.missing.length && !open.channels) open.channels = { status: 'wait', why: 'Asked on ' + u.name + '.', at: u.name };
    u.asks = JSON.parse(JSON.stringify(open));
    last = u.step;
  });
}

const TAG = { change: ['Change in KTuner', ''], watch: ['Watch in TunerView', ''], drive: ['Next drive', 'drive'], none: ['Nothing to do', 'none'] };
function replyHtml(u) {
  const st = u.step, s = u.sum;
  const closes = u.closed.length ? `<div class="close"><div class="eyebrow">What I asked last time</div>${u.closed.map((c) => `<div class="row">${pill(c.status)}<span><b>${ASK[c.k].title}.</b> ${esc(c.why)}</span></div>`).join('')}</div>` : '';
  const nums = s ? `<div class="tiles">${tile(n(s.iatMoving) + ' °C', 'intake air, moving')}${tile(n(s.kcStart, 2) + ' → ' + n(s.kcPeak, 2), 'Knock Control, start → peak')}${tile(sg(s.trimWorst, 1) + ' %', 'worst fuel trim')}${tile(s.hardPulls, 'hard pulls')}</div>` : '';
  const fit = u.plan.route === 'preset' && ANSWERS.housing ? FIT[ANSWERS.housing] : null;
  const kt = `<div class="kt">KTuner Flash plan: <b>${esc(u.plan.headline)}</b>${st.ktNote ? `<div class="muted" style="margin-top:4px">${esc(st.ktNote)}</div>` : ''}
    ${fit ? `<div style="margin-top:6px">${fit[0] ? `Whenever you flash an edited map again: <b>MAF Scaling → ${esc(fit[0])}</b>. ` : ''}<span class="muted">${esc(fit[1])}</span></div>` : ''}</div>`;
  return `<div class="up"><b>Uploaded</b> ${esc(u.file)}</div>
    <div class="card reply"><div class="eyebrow">${u.name} ${pill(u.verdict)}</div><div class="say">${esc(verdictLine(u))}</div>${nums}${closes}${questionsHtml(u)}
    <div class="step${st.same ? ' same' : ''}"><span class="tag ${TAG[st.kind][1]}">${TAG[st.kind][0]}</span>${st.same ? ' <span class="muted">same step as last time</span>' : ''}
      <h3>${esc(st.title)}</h3>${st.same ? '' : st.body + (st.watch ? `<div class="eyebrow" style="margin-top:12px">Watch live while you drive</div>${gauges(st.watch)}` : '')}
      ${st.same || st.kind === 'none' ? '' : kt}
      <div class="when">${st.proves ? `<b>The next upload proves:</b> ${esc(st.proves)}. ` : ''}<b>Upload:</b> ${esc(st.when)}.</div></div></div>`;
}
const qsFor = (u) => Object.keys(QS).filter((q) => QS[q].at === u.id && QS[q].show(u));
function questionsHtml(u) {
  return qsFor(u).map((q) => {
    const Q = QS[q], a = ANSWERS[q], o = a && Q.opts[a];
    if (o) return `<div class="qbox"><p>${Q.q(u)}</p><div class="up mine"><b>You:</b> ${esc(o.label)} <button class="link" data-q="${q}" data-o="">change</button></div>${o.reply ? `<p class="muted">${esc(o.reply)}</p>` : ''}</div>`;
    return `<div class="qbox open"><div class="eyebrow">I need one answer</div><p>${Q.q(u)}</p><div class="opts">${Object.keys(Q.opts).map((k) => `<button class="opt" data-q="${q}" data-o="${k}">${esc(Q.opts[k].label)}</button>`).join('')}</div></div>`;
  }).join('');
}
function asksHtml(u) {
  const keys = Object.keys(u.asks);
  const mine = U.slice(0, U.indexOf(u) + 1).flatMap((p) => qsFor(p).filter((q) => !ANSWERS[q]).map((q) => ({ q, at: p.name })));
  if (!keys.length && !mine.length) return '<p class="muted">Nothing asked yet.</p>';
  return `<ul class="asks">${mine.map((m) => `<li>${pill('you')}<b>${QS[m.q].short}</b><span class="why">Asked on ${m.at}.</span></li>`).join('')}${keys.map((k) => `<li>${pill(u.asks[k].status)}<b>${ASK[k].title}</b><span class="why">${esc(u.asks[k].why)}</span></li>`).join('')}</ul>`;
}

let shown = 1;
function render() {
  const cur = U[shown - 1];
  const changes = U.filter((u) => u.step.kind === 'change').length, done = Object.values(cur.asks).filter((a) => a.status === 'done').length;
  document.getElementById('app').innerHTML = `<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Prototype · Civic FE 1.5T CVT · KTuner Starter 21 Dual · E10 · the owner's real uploads</div>
    <h1>Upload a log. Get one next step. The next upload proves it.</h1>
    <p>Owners ask the same thing every time: <i>“can someone who knows read my log and tell me if it's OK?”</i> Then: what do I do now?</p>
    <div class="ways">
      <div class="card"><h3>Forum</h3><p>Post a zip, wait for a volunteer. They see one log, none of your history, and never hear how it went.</p></div>
      <div class="card"><h3>KTuner alone</h3><p>Gauges and tables, no meaning. You don't know which number matters today, or which drive to log to find out.</p></div>
      <div class="card ours"><h3>This loop</h3><p>Each upload: is it OK (with your numbers), did last time's step work, and <b>one</b> next step: a change in KTuner, a gauge to watch, a drive to log, or nothing.</p></div>
    </div>
  </header>
  <div class="layout">
    <main><div class="thread">${U.slice(0, shown).map(replyHtml).join('')}</div>
      <div class="ctl"><button class="btn" id="next" ${shown >= U.length ? 'disabled' : ''}>${shown >= U.length ? 'All 9 uploads shown' : 'Upload the next log ▸ ' + esc(U[shown].file)}</button>
        <button class="btn ghost" id="all" ${shown >= U.length ? 'disabled' : ''}>Show all</button><button class="btn ghost" id="reset">Start over</button></div></main>
    <aside class="side"><div class="card"><div class="eyebrow">Open asks after ${cur.name}</div>${asksHtml(cur)}
      <p class="muted" style="margin-top:10px">${shown} of ${U.length} uploads · ${done} asks proven · ${changes} KTuner change${changes === 1 ? '' : 's'} in ${U.length} uploads</p></div></aside>
  </div>
  <footer class="page"><div class="card"><h3>What to expect from this loop</h3><ul class="expect">
    <li>Most uploads end in “no map change”. That is the answer, not a gap: on this car the turbo has no headroom left (wastegate ~2.5 % open at peak).</li>
    <li>Heat is never counted as tuning. A hot drive can't prove a cool-day change; you'll see “can't tell yet” and why.</li>
    <li>Only the Flash plan names a KTuner table. The steps here never type a cell, so two screens can't give two edits.</li>
    <li>It never edits ignition, never turns off emissions monitors without the đăng kiểm warning, and never promises power.</li></ul>
    <p class="muted">Engine: kta-engine / kta-drive / kta-car, unchanged. Owner questions: docs/research/owner-voices.md. Plays and the KTuner card: docs/research/tuner-play-panel.md.</p></div></footer></div>`;
  const q = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  q('next', () => { shown++; render(); document.querySelectorAll('.reply')[shown - 1].scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  q('all', () => { shown = U.length; render(); });
  q('reset', () => { shown = 1; ANSWERS = {}; replay(); render(); scrollTo(0, 0); });
}
document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-q]');
  if (!b) return;
  if (b.dataset.o) ANSWERS[b.dataset.q] = b.dataset.o; else delete ANSWERS[b.dataset.q];
  replay(); render();
});
boot().then(render).catch((e) => { document.getElementById('app').innerHTML = `<div class="boot">Couldn't read the logs: ${esc(e.message)}</div>`; console.error(e); });
</script>
</body>
</html>
