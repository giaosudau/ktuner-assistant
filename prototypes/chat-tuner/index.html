<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Tuner prototype</title>
<!-- Throwaway prototype (see docs/research/chat-tuner-panel.md). Runs the real engine on the real drives.
     Open from the repo root over http (python3 -m http.server) or file://. Nothing here is imported by the app. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Chakra+Petch:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
/* Tokens copied from app/app.css (dyno sheet look). No new hues. */
:root {
  --paper: #EDF0F2; --sheet: #FFFFFF; --sheet-2: #F6F8F9; --sheet-3: #EEF2F5;
  --ink: #111B24; --ink-2: #3D4955; --ink-3: #5B6874; --line: #D5DCE2; --line-2: #E6EBEF; --line-3: #C3CCD4;
  --accent: #2450C8; --accent-ink: #FFFFFF; --accent-tint: #E8EEFB; --accent-text: #2450C8; --accent-line: #AFC3EE;
  --good-bg: #E5F3E8; --good-fg: #1C6B32; --good-ic: #23843D;
  --watch-bg: #FFF2D2; --watch-fg: #6E4A00; --watch-ic: #B07A00;
  --stop-bg: #FCE3DF; --stop-fg: #8F2216; --stop-ic: #C8402F;
  --none-bg: #EDF1F4; --none-fg: #45515C; --none-ic: #6F7C88;
  --meas: #2A78D6; --grid: #E3E8EC; --axis: #9AA6B2; --lug: #F39A4F;
  --font-d: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-b: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-m: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1317; --sheet: #151C22; --sheet-2: #1A2229; --sheet-3: #202932;
    --ink: #E7ECF0; --ink-2: #B6C0C9; --ink-3: #93A0AC; --line: #2A343D; --line-2: #222B33; --line-3: #3A4650;
    --accent: #7D9CF6; --accent-ink: #0B1220; --accent-tint: #1D2947; --accent-text: #A9BEFA; --accent-line: #3B5190;
    --good-bg: #15301E; --good-fg: #93D9A6; --good-ic: #3FB560;
    --watch-bg: #372B0D; --watch-fg: #F2CB6B; --watch-ic: #D9A21F;
    --stop-bg: #3B1B17; --stop-fg: #F5A698; --stop-ic: #E0604E;
    --none-bg: #212A32; --none-fg: #B6C0C9; --none-ic: #8391A0;
    --meas: #3987E5; --grid: #25303A; --axis: #56636F; --lug: #C9671C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-b); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num, .mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
#stage { height: 100%; }
.boot { display: grid; place-items: center; height: 100%; color: var(--ink-3); font-size: 14px; }

/* ---------- shared cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card + .card { margin-top: 8px; }
.card h4 { margin: 0 0 2px; font: 600 12px/1.4 var(--font-b); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.card .lead { margin: 0; font-weight: 600; }
.card p { margin: 6px 0 0; color: var(--ink-2); }
.card ol, .card ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.card li + li { margin-top: 4px; }
.drive-title { font: 700 17px/1.3 var(--font-d); letter-spacing: .01em; }
.meta { color: var(--ink-3); font-size: 13px; }
.v { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font: 700 13px/20px var(--font-d); letter-spacing: .02em; }
.v::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.v-good { background: var(--good-bg); color: var(--good-fg); } .v-good::before { background: var(--good-ic); }
.v-watch { background: var(--watch-bg); color: var(--watch-fg); } .v-watch::before { background: var(--watch-ic); }
.v-stop { background: var(--stop-bg); color: var(--stop-fg); } .v-stop::before { background: var(--stop-ic); border-radius: 1px; }
.v-none { background: var(--none-bg); color: var(--none-fg); } .v-none::before { background: var(--none-ic); }
.gates { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; margin-top: 10px; font-size: 14px; align-items: center; }
.gates .g { color: var(--ink-2); }
.gates .d { color: var(--ink-3); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
.tile { background: var(--sheet-2); border-radius: 8px; padding: 8px 10px; }
.tile b { display: block; font: 600 18px/1.2 var(--font-m); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--ink-3); }
table.plan { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
table.plan td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line-2); vertical-align: top; color: var(--ink-2); }
table.plan td:first-child { color: var(--ink); font-weight: 500; }
.src { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
svg.chart { display: block; width: 100%; height: auto; margin-top: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
svg.chart text { font: 10px var(--font-m); fill: var(--ink-3); }
svg.trace { cursor: crosshair; }
.h-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 560px) { .h-grid { grid-template-columns: 1fr; } }
.h-dot { cursor: pointer; }
.h-dot:hover circle.hit { fill: var(--accent); fill-opacity: .12; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.trace-foot { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 4px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }

/* ---------- shared chat bits ---------- */
.msg { animation: msg-in 220ms var(--ease) both; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
.u { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 16px 16px 4px 16px; }
.u .file { font-family: var(--font-m); font-size: 13px; }
.a-text { margin: 0 0 8px; }
.trace-line { margin-top: 6px; font: 11px/1.4 var(--font-m); color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--accent-line); background: var(--sheet); color: var(--accent-text); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background-color 150ms ease-out; }
.chip:hover { background: var(--accent-tint); }
.chip:active { transform: scale(0.97); }
.composer { display: flex; gap: 6px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.composer input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 6px 8px; outline: none; }
.icon-btn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--sheet-2); cursor: pointer; color: var(--ink-2); }
.icon-btn.send { background: var(--accent); color: var(--accent-ink); }
.icon-btn:active { transform: scale(0.97); }
.sel { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-tint); color: var(--accent-text); border-radius: 8px; padding: 4px 6px 4px 10px; font-size: 13px; white-space: nowrap; }
.sel button { border: 0; background: transparent; cursor: pointer; color: inherit; padding: 0 4px; }
.typing { color: var(--ink-3); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- V1 Thread ---------- */
.v1 { height: 100%; display: flex; flex-direction: column; }
.v1-head { flex: none; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--sheet); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.v1-head b { font: 700 16px var(--font-d); }
.v1-log { flex: 1; overflow-y: auto; }
.v1-col { max-width: 720px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.v1-foot { flex: none; border-top: 1px solid var(--line); background: var(--paper); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.v1-foot .inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* ---------- V2 Canvas ---------- */
.v2 { height: 100%; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
.v2-chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--sheet); min-height: 0; }
.v2-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.v2-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.v2 .composer { background: var(--sheet-2); }
.refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ref { border: 1px solid var(--line); background: var(--sheet-2); border-radius: 8px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.ref[data-on] { border-color: var(--accent); color: var(--accent-text); background: var(--accent-tint); }
.v2-board { min-width: 0; overflow-y: auto; padding: 72px 24px 80px; }
.v2-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.v2-tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.v2-tab[data-on] { color: var(--ink); border-bottom-color: var(--accent); }
.v2-board .card { max-width: 860px; }
@media (max-width: 820px) { .v2 { grid-template-columns: 1fr; grid-template-rows: 55% 45%; } .v2-chat { order: 2; border-right: 0; border-top: 1px solid var(--line); } .v2-board { padding: 12px 16px 24px; } }

/* ---------- V3 Pit wall ---------- */
.v3 { height: 100%; display: flex; flex-direction: column; }
.v3-strip { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 64px 16px 10px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.v3-drive { flex: none; border: 1px solid var(--line); background: var(--sheet-2); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: 12px; line-height: 1.35; }
.v3-drive b { display: block; font: 600 13px var(--font-d); }
.v3-drive[data-on] { border-color: var(--accent); background: var(--accent-tint); }
.v3-drive .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.v3-main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: 1fr 260px; gap: 16px; align-content: start; max-width: 1200px; width: 100%; margin: 0 auto; }
.v3-moments { display: flex; flex-direction: column; gap: 6px; }
.v3-moment { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
.v3-moment:hover { border-color: var(--accent-line); }
.v3-moment .mono { color: var(--ink-3); margin-right: 6px; }
@media (max-width: 820px) { .v3-main { grid-template-columns: 1fr; } }
.v3-sheet { flex: none; background: var(--sheet); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.08); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; max-height: 46vh; }
.v3-grab { align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line-3); margin: 8px 0 2px; border: 0; padding: 0; cursor: pointer; }
.v3-log { overflow-y: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
.v3-sheet[data-min] .v3-log > :not(:last-child) { display: none; }
.v3-foot { padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto; }

/* ---------- Picker (PICKER.md, verbatim) ---------- */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>

<body>
<div id="stage"><div class="boot">Reading your drives with the engine…</div></div>

<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Thread</button>
  <button class="proto-picker-item">Canvas</button>
  <button class="proto-picker-item">Pit wall</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script src="../../engine/kta-engine.js"></script>
<script src="../../engine/kta-drive.js"></script>
<script src="../../engine/kta-car.js"></script>
<script src="../../engine/kta-ask.js"></script>
<script src="../../app/i18n.js"></script>
<script src="../../app/i18n-drive.js"></script>
<script src="../../data/example-aug22-0903.js"></script>
<script src="../../data/example-aug22-0950.js"></script>
<script src="../../data/example-aug23-1959.js"></script>
<script src="../../data/example-aug23-2038.js"></script>
<script src="../../data/example-aug30-1509.js"></script>
<script src="../../data/example-aug30-1529.js"></script>
<script src="../../data/example-aug30-1601.js"></script>
<script src="../../data/example-sep01-0813.js"></script>
<script src="../../data/example-sep05-0756.js"></script>
<script>
'use strict';
const K = window.KTA, F = K.fmt, T = window.KTA_I18N.en.drive;
const EX = ['aug22-0903', 'aug22-0950', 'aug23-1959', 'aug23-2038', 'aug30-1509', 'aug30-1529', 'aug30-1601', 'sep01-0813', 'sep05-0756'];
const DB = { car: K.carEmpty(), recs: [] };   // recs: one per judged drive, time order

// ===================================================================== engine glue
function decode(gz) {
  const bin = atob(gz), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function ingest(text, fileName) {
  const t0 = performance.now();
  const log = K.readLog(text);
  const out = K.carIngest(DB.car, log, { fileName });
  DB.car = out.state;
  const r = out.report;
  if (!r || r.tooShort || !r.drive) return null;
  const rec = { id: r.identity, fileName, log, rep: r.drive, car: r, ms: Math.round(performance.now() - t0) };
  DB.recs = DB.recs.filter((x) => x.id !== rec.id).concat(rec).sort((a, b) => a.id.localeCompare(b.id));
  return rec;
}
async function boot() {
  for (const id of EX) { const ex = window.KTA_EXAMPLES[id]; ingest(await decode(ex.gz), ex.name); }
}
const recById = (id) => DB.recs.find((r) => r.id === id);

// ===================================================================== formatting
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pad = (n) => String(n).padStart(2, '0');
function idMs(id) { return Date.UTC(+id.slice(0, 4), +id.slice(4, 6) - 1, +id.slice(6, 8), +id.slice(9, 11), +id.slice(11, 13), +id.slice(13, 15)); }
function dayOf(id) { const d = new Date(idMs(id)); return DAY[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; }
function clock(id, t) { const d = new Date(idMs(id) + (t || 0) * 1000); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
const n = (v, d) => (typeof v === 'number' && isFinite(v) ? F.num(v, d || 0) : '–');
const VERDICT = { good: ['OK', 'v-good'], watch: ['Watch', 'v-watch'], stop: ['Stop', 'v-stop'] };
function pill(status) { const v = VERDICT[status] || ["Can't tell", 'v-none']; return `<span class="v ${v[1]}">${v[0]}</span>`; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function driveName(rec) { return dayOf(rec.id) + ' · ' + clock(rec.id); }

// ===================================================================== widgets (engine view → HTML)
// The widget catalog of the panel (C3). Each takes engine output only.
const W = {};
W.drive_card = (rec) => {
  const I = rec.rep.ins, m = I.meta, town = m.townSeconds / Math.max(1, m.movingSeconds);
  const map = rec.car.map && rec.car.map.recorded ? 'Map: ' + esc(rec.car.map.name) : 'Map: not recorded';
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
    <div><div class="drive-title">${driveName(rec)} · ${Math.round(m.duration / 60)} min · ${I.heat.hot ? 'Hot' : 'Cool'} · ${town > 0.5 ? 'Traffic' : 'Mixed'}</div>
    <div class="meta">${map} · peak boost target <span class="num">${n(rec.car.summary && rec.car.summary.boostTarget, 1)}</span> psi · ${n(m.rows)} rows read in <span class="num">${rec.ms}</span> ms on this device</div></div>
    ${pill(rec.rep.an.verdict)}</div></div>`;
};
function gateRows(rec) {
  const rank = { stop: 3, watch: 2, nodata: 1, none: 1, good: 0 };
  return rec.rep.an.gates.map((g) => {
    const w = g.checks.slice().sort((a, b) => (rank[b.status] || 0) - (rank[a.status] || 0))[0];
    return w ? `<span class="g">${esc(g.label)}</span><span class="d">${esc(w.label)}: ${esc(w.display)}</span>${pill(w.status)}` : '';
  }).join('');
}
W.safety = (rec) => `<div class="card"><h4>Can I drive hard today?</h4>
  <p class="lead">${pill(rec.rep.an.verdict)} ${esc(T.safe[rec.rep.an.verdict] || T.safe.nodata)}</p>
  <div class="gates">${gateRows(rec)}</div></div>`;
function topAction(rec) { const P = rec.rep.plan; return P.now[0] || P.next[0] || null; }
function actionText(a) {
  const D = T.actions[a.id] || T.actions.fix;
  const label = (a.check && a.check.label) || a.label || a.id;
  return {
    title: typeof D.title === 'function' ? D.title(label) : D.title,
    why: typeof D.why === 'function' ? D.why(a.tier === 'safety' ? (a.check && a.check.display) || '' : a.ev || {}, F) : '',
    steps: typeof D.steps === 'function' ? D.steps((a.check && a.check.fix) || '') : D.steps || [],
    proof: typeof D.proof === 'function' ? D.proof(a.tier === 'safety' ? label : a.ev || {}, F) : ''
  };
}
W.one_thing = (rec) => {
  const a = topAction(rec);
  if (!a) return `<div class="card"><h4>What should I do?</h4><p class="lead">${esc(T.noActions)}</p></div>`;
  const t = actionText(a);
  return `<div class="card"><h4>Your one thing</h4><p class="lead">${esc(t.title)}</p><p>${esc(t.why)}</p>
    ${t.steps.length ? '<ol>' + t.steps.map((s) => `<li>${esc(s)}</li>`).join('') + '</ol>' : ''}
    ${t.proof ? `<p><b>Proof on the next drive:</b> ${esc(t.proof)}</p>` : ''}</div>`;
};

// ---- the drive trace: Fuel-quality score over rpm, lugging shaded, brushable (C4)
function trace(rec, sel, big) {
  const tl = rec.rep.ins.kc && rec.rep.ins.kc.timeline;
  if (!tl || !tl.length) return `<div class="card"><h4>Drive trace</h4><p>Can't tell: the Fuel-quality score is not in this log.</p></div>`;
  const w = 640, h = big ? 260 : 210, L = 44, R = 10, top = 10, mid = big ? 150 : 112, low = mid + 14, bot = h - 22;
  const tMax = tl[tl.length - 1].t + 5;
  const peak = Math.max(...tl.map((p) => p.v)), vLo = 0.47, vHi = Math.max(0.6, peak + 0.02);
  const rMax = Math.max(3500, ...tl.map((p) => p.rpm));
  const X = (t) => L + (t / tMax) * (w - L - R);
  const Y = (v) => mid - ((v - vLo) / (vHi - vLo)) * (mid - top);
  const Yr = (r) => bot - (r / rMax) * (bot - low);
  const bands = tl.filter((p) => p.lug >= 0.25).map((p) => `<rect x="${X(p.t).toFixed(1)}" y="${top}" width="${(X(5) - X(0) + 0.6).toFixed(1)}" height="${bot - top}" fill="var(--lug)" opacity=".28"/>`).join('');
  const line = (f, k) => tl.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + f(p[k]).toFixed(1)).join(' ');
  const ticks = [];
  for (let s = 0; s <= tMax; s += tMax > 2400 ? 600 : 300) ticks.push(`<text x="${X(s)}" y="${h - 6}" text-anchor="middle">${clock(rec.id, s)}</text>`);
  const pulls = ((rec.rep.ins.boost && rec.rep.ins.boost.events) || []).filter((e) => e.hard)
    .map((e) => `<path d="M${X(e.t0) - 4} ${top} h8 l-4 7z" fill="var(--ink-2)"><title>Hard pull at ${clock(rec.id, e.t0)}: ${e.mapMax} psi, intake ${e.iat0} °C</title></path>`).join('');
  const s = sel && sel.kind === 'window' && sel.id === rec.id
    ? `<rect x="${X(sel.t0)}" y="${top}" width="${Math.max(2, X(sel.t1) - X(sel.t0))}" height="${bot - top}" fill="var(--accent)" fill-opacity=".14" stroke="var(--accent)" stroke-width="1"/>` : '';
  return `<div class="card"><h4>${big ? 'Drive trace · ' + driveName(rec) : 'Why it rose'}</h4>
    <svg class="chart trace" viewBox="0 0 ${w} ${h}" data-id="${rec.id}" data-l="${L}" data-r="${w - R}" data-tmax="${tMax}" role="img" aria-label="Fuel-quality score and rpm over the drive; drag to select a stretch and ask about it">
      ${bands}
      <line x1="${L}" x2="${w - R}" y1="${Y(0.49)}" y2="${Y(0.49)}" stroke="var(--axis)" stroke-dasharray="4 3"/>
      <text x="${w - R}" y="${Y(0.49) - 4}" text-anchor="end">your normal 0.49</text>
      <text x="4" y="${top + 8}">${vHi.toFixed(2)}</text><text x="4" y="${(top + mid) / 2 + 3}">score</text><text x="4" y="${Y(vLo) - 2}">${vLo}</text>
      <path d="${line(Y, 'v')}" fill="none" stroke="var(--meas)" stroke-width="2" stroke-linejoin="round"/>
      <line x1="${L}" x2="${w - R}" y1="${bot}" y2="${bot}" stroke="var(--grid)"/>
      <text x="4" y="${low + 8}">${n(rMax)}</text><text x="4" y="${(low + bot) / 2 + 3}">rpm</text><text x="4" y="${bot}">0</text>
      <path d="${line(Yr, 'rpm')}" fill="none" stroke="var(--ink-3)" stroke-width="1" opacity=".8"/>
      ${pulls}${ticks.join('')}<g class="brush">${s}</g>
    </svg>
    <div class="trace-foot"><span><span class="sw" style="background:var(--meas)"></span> Fuel-quality score</span>
      <span><span class="sw" style="background:var(--lug);opacity:.5"></span> lugging (900–1,700 rpm with load)</span><span>▼ hard pull</span>
      <span style="margin-left:auto">Drag across the chart to ask about that stretch</span></div></div>`;
}
W.drive_trace = (rec, sel) => trace(rec, sel, false);

// ---- Car history: small multiples, one hue, hollow = hot, ✕ ring = Stop; tap a dot (C4)
W.history = (rec) => {
  const S = K.carChartSeries(DB.car).series;
  const pick = [['kcPeak', 'Fuel-quality score peak', 2, 0.49], ['lugShare', 'Lugging, % of moving', 1, null], ['iatMoving', 'Intake while moving, °C', 0, null]];
  const charts = pick.map(([key, label, dp, base]) => {
    const pts = (S.find((s) => s.key === key) || { points: [] }).points.filter((p) => typeof p.value === 'number');
    if (!pts.length) return '';
    const w = 220, h = 120, L = 8, R = 8, top = 22, bot = h - 18;
    const vals = pts.map((p) => p.value).concat(base == null ? [] : [base]);
    const lo = Math.min(...vals), hi = Math.max(...vals), pad2 = (hi - lo || 1) * 0.15;
    const X = (i) => L + 8 + (i / Math.max(1, pts.length - 1)) * (w - L - R - 16);
    const Y = (v) => bot - ((v - lo + pad2) / (hi - lo + 2 * pad2)) * (bot - top);
    const dots = pts.map((p, i) => {
      const on = p.x === rec.id, stop = p.verdict === 'stop';
      return `<g class="h-dot" data-id="${p.x}" tabindex="0" role="button" aria-label="${dayOf(p.x)} ${clock(p.x)}: ${n(p.value, dp)}">
        <title>${dayOf(p.x)} · ${clock(p.x)}: ${n(p.value, dp)} · ${p.cool ? 'Cool' : 'Hot'} · ${(VERDICT[p.verdict] || ["Can't tell"])[0]}</title>
        <circle class="hit" cx="${X(i)}" cy="${Y(p.value)}" r="12" fill="transparent"/>
        ${stop ? `<circle cx="${X(i)}" cy="${Y(p.value)}" r="8" fill="none" stroke="var(--stop-ic)" stroke-width="2"/>` : ''}
        <circle cx="${X(i)}" cy="${Y(p.value)}" r="4.5" fill="${p.cool ? 'var(--meas)' : 'var(--sheet)'}" stroke="var(--meas)" stroke-width="2"/>
        ${on ? `<line x1="${X(i)}" x2="${X(i)}" y1="${top - 4}" y2="${bot}" stroke="var(--accent)" stroke-dasharray="2 2"/>` : ''}</g>`;
    }).join('');
    const baseLine = base == null ? '' : `<line x1="${L}" x2="${w - R}" y1="${Y(base)}" y2="${Y(base)}" stroke="var(--axis)" stroke-dasharray="4 3"/>`;
    return `<div><div class="meta">${label}</div><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} per drive">
      <line x1="${L}" x2="${w - R}" y1="${bot}" y2="${bot}" stroke="var(--grid)"/>${baseLine}
      <text x="${L}" y="${Y(hi) - 8}">${n(hi, dp)}</text><text x="${L}" y="${Y(lo) + 14}">${n(lo, dp)}</text>${dots}
      <text x="${L}" y="${h - 4}">${dayOf(pts[0].x)}</text><text x="${w - R}" y="${h - 4}" text-anchor="end">${dayOf(pts[pts.length - 1].x)}</text></svg></div>`;
  }).join('');
  const stops = DB.recs.filter((r) => r.rep.an.verdict === 'stop').length;
  return `<div class="card"><h4>Is my car changing?</h4><p class="lead">${DB.recs.length} drives since ${dayOf(DB.recs[0].id)} · ${stops} Stop · ${DB.car.flashes.length ? DB.car.flashes.length + ' Flashes' : 'no Flash recorded'}</p>
    <div class="h-grid">${charts}</div><div class="hint">Filled dot = Cool drive · hollow = hot · red ring = Stop. Tap a dot to open that drive.</div></div>`;
};

// ---- Prove it: like with like, or "can't tell"
function proofPair(rec) {
  const i = DB.recs.indexOf(rec), after = DB.recs[i + 1], a = topAction(rec);

  return { a, after, res: K.proveAction(a.id, K.proofSnapshot(rec.rep), after.rep) };
}

  return `<div class="card"><h4>Did it work? · ${esc(actionText(p.a).title)}</h4>
    <p class="lead">${esc(T.verdicts[r.verdict] || r.verdict)}</p>${reasons.map((x) => `<p>${esc(x)}</p>`).join('')}

    <div class="tile"><b>${n(m.after, 1)}</b><span>${esc(T.metricNames[m.name] || m.name)} · ${driveName(p.after)}</span></div></div>

};

// ---- a brushed window: numbers from the timeline only (tool get_window)
function windowStats(rec, t0, t1) {
  const pts = rec.rep.ins.kc.timeline.filter((p) => p.t >= t0 && p.t <= t1);
  if (pts.length < 2) return null;
  const med = (k) => { const v = pts.map((p) => p[k]).sort((a, b) => a - b); return v[Math.floor(v.length / 2)]; };
  // Steps, like the engine's evidence ("31 of 41 steps while lugging"): where the score went up, was the car lugging?
  const steps = pts.filter((p, i) => i && p.v > pts[i - 1].v);
  return { from: pts[0].v, to: pts[pts.length - 1].v, peak: Math.max(...pts.map((p) => p.v)), lug: 100 * pts.reduce((s, p) => s + p.lug, 0) / pts.length, steps: steps.length, lugSteps: steps.filter((p) => p.lug > 0).length, rpm: med('rpm'), vss: med('vss'), iat: med('iat') };
}
W.window = (rec, sel) => {
  const s = windowStats(rec, sel.t0, sel.t1);
  return trace(rec, sel, false).replace('<h4>Why it rose</h4>', `<h4>${clock(rec.id, sel.t0)}–${clock(rec.id, sel.t1)} · ${dayOf(rec.id)}</h4>`) +
    (s ? `<div class="card"><div class="tiles">
      <div class="tile"><b>${n(s.from, 2)} → ${n(s.to, 2)}</b><span>Fuel-quality score</span></div>
      <div class="tile"><b>${s.lugSteps} of ${s.steps}</b><span>score steps while lugging</span></div>
      <div class="tile"><b>${n(s.rpm)}</b><span>rpm, typical</span></div>
      <div class="tile"><b>${n(s.vss)} km/h</b><span>speed, typical</span></div>
      <div class="tile"><b>${n(s.iat)} °C</b><span>intake</span></div></div></div>` : '');
};

// ===================================================================== the brain
// Stand-in for the model: routes a question to engine cards + ≤ 2 sentences built from card numbers.
// With a key, KTA.ask would choose the same widgets via show(); the checks in the panel doc apply.
function brain(q, rec, sel) {
  const s = String(q || '').toLowerCase(), I = rec.rep.ins, kc = I.kc || {};
  if (sel && sel.kind === 'drive') {
    const r2 = recById(sel.id);
    return { rec: r2, text: '', cards: ['drive_card', 'safety', 'one_thing'], chips: ['Why did it rise?', 'Did my habit work?', 'Next Flash?'], tools: ['get_overview(' + sel.id + ')', 'show(drive_card)', 'show(safety)', 'show(one_thing)'] };
  }
  if (sel && sel.kind === 'window') {
    const w = windowStats(rec, sel.t0, sel.t1);
    let text = 'Not enough of the log in that stretch. Drag across a wider part.';
    if (w) {
      const rose = w.to - w.from >= 0.02, lugged = w.steps && w.lugSteps / w.steps >= 0.5;
      text = `${clock(rec.id, sel.t0)}–${clock(rec.id, sel.t1)}: the score went ${n(w.from, 2)} → ${n(w.to, 2)}, and ${w.lugSteps} of its ${w.steps} steps up came while lugging, at about ${n(w.rpm)} rpm, ${n(w.vss)} km/h, intake ${n(w.iat)} °C. ` +
        (rose && lugged ? 'That is the pattern your one thing targets: low rpm with load on hot fuel.' : rose ? 'It rose mostly outside lugging here, so look at intake heat first.' : 'The score held here, so the ECU learned nothing bad in this stretch.');
    }
    return { text, cards: ['window'], chips: ['Show my car over time', 'What should I do?', 'Next Flash?'], tools: [`get_window(${rec.id}, ${Math.round(sel.t0)}, ${Math.round(sel.t1)})`, 'show(drive_trace)'] };
  }
  if (/why|rise|rose|flat|tại sao|vì sao|knock|score/.test(s)) {
    const a = topAction(rec), ev = (a && a.ev) || {};
    return { text: kc.rise > 0.02 ? `The score climbed ${n(kc.start, 2)} → ${n(kc.peak, 2)}, mostly in the orange bands: ${n(I.lug.share, 1)} % of moving time lugging at about ${n(I.lug.rpm)} rpm. ${ev.riseAt ? 'The first rise was at ' + clock(rec.id, ev.riseAt) + '.' : ''}` : `The score stayed near ${n(kc.end, 2)} on this drive.`,
      cards: ['drive_trace'], chips: ['Show my car over time', 'Did my habit work?'], tools: ['get_insight(knock)', 'get_insight(lugging)', 'show(drive_trace)'] };
  }
  if (/history|over time|chang|trend|lịch sử|getting/.test(s)) return { text: '', cards: ['history'], chips: ['Did my habit work?', 'Next Flash?'], tools: ['get_car_history()', 'show(history)'] };
  if (/work|prove|better|did it|improv|habit/.test(s)) return { text: '', cards: ['prove'], chips: ['Show my car over time', 'Next Flash?'], tools: ['compare_drives()', 'show(prove)'] };
  if (/boost|psi|power|faster map|mạnh/.test(s)) return { text: 'Not now. More boost is locked, and here is exactly what unlocks it.', cards: ['locked_lever', 'flash_plan'], chips: ['Why did it rise?', 'Show my car over time'], tools: ['get_action(moreBoost)', 'get_flash_plan()', 'show(locked_lever)', 'show(flash_plan)'] };
  if (/flash|map|ktuner|edit|table|afr|mixture/.test(s)) return { text: '', cards: ['flash_plan'], chips: ['More boost?', 'What should I do?'], tools: ['get_flash_plan()', 'show(flash_plan)'] };
  if (/safe|hard|an toàn|ok\b/.test(s)) return { text: '', cards: ['safety'], chips: ['What should I do?', 'Why did it rise?'], tools: ['get_overview()', 'show(safety)'] };
  if (/first|next|do\b|should|làm gì/.test(s)) return { text: '', cards: ['one_thing'], chips: ['Why did it rise?', 'Next Flash?'], tools: ['get_action(' + ((topAction(rec) || {}).id || '-') + ')', 'show(one_thing)'] };
  // Anything else: the built-in answer the app already ships (KTA.ask.offline).
  const off = K.ask.offline(q, K.ask.context({ report: rec.rep, T, F }));
  return { text: off.answer, cards: [], chips: ['Is it safe?', 'Why did it rise?', 'Next Flash?'], tools: ['ask.offline(' + off.intent + ')'] };
}
function dropReply(rec) {
  return { rec, text: '', cards: ['drive_card', 'safety', 'one_thing'], chips: ['Why did it rise?', 'Show my car over time', 'Next Flash?'], tools: ['carIngest()', 'show(drive_card)', 'show(safety)', 'show(one_thing)'] };
}
const renderCards = (r, rec, sel) => r.cards.map((c) => W[c](rec, sel)).join('');
const traceLine = (r) => `<div class="trace-line">${r.tools.join(' · ')} · built-in answer, numbers from the engine</div>`;
const chipsHtml = (list) => `<div class="chips">${list.map((c) => `<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
const CARD_NAMES = { drive_card: 'Drive', safety: 'Safety', one_thing: 'One thing', drive_trace: 'Trace', history: 'Over time', prove: 'Proof', locked_lever: 'More boost', flash_plan: 'Next Flash', window: 'Selection' };

// ===================================================================== interactions shared by all variants
let ACTIVE = null;   // the mounted variant: { onSelect(sel), onAsk(q), onFile(text, name) }
function svgT(svg, clientX) {
  const b = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, x = ((clientX - b.left) / b.width) * vb.width;
  const L = +svg.dataset.l, R = +svg.dataset.r, tMax = +svg.dataset.tmax;
  return Math.max(0, Math.min(tMax, ((x - L) / (R - L)) * tMax));
}
let brush = null;
document.addEventListener('pointerdown', (e) => {
  const svg = e.target.closest && e.target.closest('svg.trace');
  if (!svg) return;
  svg.setPointerCapture(e.pointerId);
  brush = { svg, a: svgT(svg, e.clientX), b: null };
});
document.addEventListener('pointermove', (e) => {
  if (!brush) return;
  brush.b = svgT(brush.svg, e.clientX);
  const L = +brush.svg.dataset.l, R = +brush.svg.dataset.r, tMax = +brush.svg.dataset.tmax, X = (t) => L + (t / tMax) * (R - L);
  const lo = Math.min(brush.a, brush.b), hi = Math.max(brush.a, brush.b), vb = brush.svg.viewBox.baseVal;
  brush.svg.querySelector('.brush').innerHTML = `<rect x="${X(lo)}" y="10" width="${X(hi) - X(lo)}" height="${vb.height - 32}" fill="var(--accent)" fill-opacity=".14" stroke="var(--accent)"/>`;
});
document.addEventListener('pointerup', () => {
  if (!brush) return;
  let t0 = Math.min(brush.a, brush.b == null ? brush.a : brush.b), t1 = Math.max(brush.a, brush.b == null ? brush.a : brush.b);
  if (t1 - t0 < 30) { const c = (t0 + t1) / 2; t0 = Math.max(0, c - 90); t1 = Math.min(+brush.svg.dataset.tmax, c + 90); }   // a tap = 3 minutes around it
  const id = brush.svg.dataset.id; brush = null;
  ACTIVE && ACTIVE.onSelect({ kind: 'window', id, t0, t1 });
});
document.addEventListener('click', (e) => {
  const dot = e.target.closest && e.target.closest('.h-dot');
  if (dot) { ACTIVE && ACTIVE.onSelect({ kind: 'drive', id: dot.dataset.id }); return; }
  const chip = e.target.closest && e.target.closest('[data-q]');
  if (chip && ACTIVE) ACTIVE.onAsk(chip.dataset.q);
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('h-dot')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
const selLabel = (sel) => sel.kind === 'window' ? `📍 ${clock(sel.id, sel.t0)}–${clock(sel.id, sel.t1)} · ${dayOf(sel.id)}` : `📍 ${dayOf(sel.id)} · ${clock(sel.id)}`;
function composer(placeholder) {
  return `<div class="sel-slot"></div><form class="composer" autocomplete="off">
    <label class="icon-btn" title="Add a TunerView CSV" aria-label="Add a TunerView CSV">＋<input type="file" accept=".csv,text/csv" hidden></label>

function wireComposer(root, v) {
  const form = root.querySelector('form.composer'), input = form.querySelector('input[type=text]');
  form.addEventListener('submit', (e) => { e.preventDefault(); const q = input.value.trim(); if (!q && !v.sel) return; input.value = ''; v.onAsk(q || 'What happened here?'); });
  form.querySelector('input[type=file]').addEventListener('change', (e) => {

}
function fileTurn(v, text, name) {

  catch (err) { v.say({ text: 'That file is not a TunerView log I can read: ' + err.message, cards: [], chips: [], tools: [] }, v.rec); }
}

    <div class="v1-foot"><div class="inner"><div class="chips-slot"></div>${composer('Ask about your car, or ＋ a drive')}</div></div></div>`;
  const col = stage.querySelector('.v1-col'), log = stage.querySelector('.v1-log'), chipsSlot = stage.querySelector('.chips-slot');
  const scroll = () => requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  v.userFile = (name) => { col.insertAdjacentHTML('beforeend', `<div class="msg u"><span class="file">📎 ${esc(name)}</span></div>`); };
  v.say = (r, rec) => {
    if (r.rec) v.rec = r.rec;
    col.insertAdjacentHTML('beforeend', `<div class="msg">${r.text ? `<p class="a-text">${esc(r.text)}</p>` : ''}${renderCards(r, v.rec, v.sel)}${traceLine(r)}</div>`);
    chipsSlot.innerHTML = chipsHtml(r.chips); scroll();
  };
  v.onAsk = (q) => {
    col.insertAdjacentHTML('beforeend', `<div class="msg u">${v.sel ? `<div style="font-size:12px;opacity:.85">${selLabel(v.sel)}</div>` : ''}${esc(q)}</div>`);
    const r = brain(q, v.rec, v.sel); v.say(r, v.rec); v.sel = null; v.showSel();
  };
  v.onSelect = (sel) => {
    if (sel.kind === 'drive') { v.sel = sel; v.onAsk('Open this drive'); return; }
    v.sel = sel; v.showSel(); chipsSlot.innerHTML = chipsHtml(['Why did it rise here?', 'What was I doing here?']);
    stage.querySelector('form.composer input[type=text]').focus({ preventScroll: true });
  };
  v.onFile = (text, name) => fileTurn(v, text, name);
  wireComposer(stage, v); ACTIVE = v;
  v.userFile(v.rec.fileName); v.say(dropReply(v.rec), v.rec);
}

// ===================================================================== V2 Canvas: chat drives a board (laptop at home)
function mountCanvas(stage) {
  const v = { rec: DB.recs.find((r) => r.id.startsWith('20260830-16')), sel: null, tabs: [], on: null };
  stage.innerHTML = `<div class="v2"><section class="v2-chat"><div class="v2-log"></div><div class="v2-foot"><div class="chips-slot"></div>${composer('Ask, or point at the board')}</div></section>
    <main class="v2-board"><div class="v2-tabs" role="tablist"></div><div class="v2-body"></div></main></div>`;
  const log = stage.querySelector('.v2-log'), tabs = stage.querySelector('.v2-tabs'), body = stage.querySelector('.v2-body'), chipsSlot = stage.querySelector('.chips-slot');
  const draw = () => {
    tabs.innerHTML = v.tabs.map((t, i) => `<button class="v2-tab" role="tab" data-i="${i}" ${i === v.on ? 'data-on aria-selected="true"' : ''}>${t.name}</button>`).join('');
    const t = v.tabs[v.on]; body.innerHTML = t ? t.html : '';
    log.querySelectorAll('.ref').forEach((b) => b.toggleAttribute('data-on', +b.dataset.i === v.on));
  };
  tabs.addEventListener('click', (e) => { const b = e.target.closest('.v2-tab'); if (b) { v.on = +b.dataset.i; draw(); } });
  log.addEventListener('click', (e) => { const b = e.target.closest('.ref'); if (b) { v.on = +b.dataset.i; draw(); } });
  // The board keeps one tab per question topic; a new answer replaces that topic's tab (so the board never piles up).
  v.say = (r, rec) => {
    if (r.rec) v.rec = r.rec;
    const groups = r.cards.length ? [{ name: r.cards.map((c) => CARD_NAMES[c]).join(' · '), html: renderCards(r, v.rec, v.sel) }] : [];
    const refs = groups.map((g) => {
      let i = v.tabs.findIndex((t) => t.name === g.name);
      if (i < 0) { v.tabs.push(g); i = v.tabs.length - 1; } else v.tabs[i] = g;
      v.on = i; return `<button class="ref" data-i="${i}">↗ ${g.name}</button>`;
    });
    log.insertAdjacentHTML('beforeend', `<div class="msg"><p class="a-text">${esc(r.text || (r.cards.length ? 'On the board: ' + r.cards.map((c) => CARD_NAMES[c].toLowerCase()).join(', ') + ' for ' + driveName(v.rec) + '.' : ''))}</p><div class="refs">${refs.join('')}</div>${traceLine(r)}</div>`);
    chipsSlot.innerHTML = chipsHtml(r.chips); draw();
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  };
  v.userFile = (name) => log.insertAdjacentHTML('beforeend', `<div class="msg u"><span class="file">📎 ${esc(name)}</span></div>`);
  v.onAsk = (q) => { log.insertAdjacentHTML('beforeend', `<div class="msg u">${v.sel ? `<div style="font-size:12px;opacity:.85">${selLabel(v.sel)}</div>` : ''}${esc(q)}</div>`); v.say(brain(q, v.rec, v.sel), v.rec); v.sel = null; v.showSel(); };
  v.onSelect = (sel) => {
    if (sel.kind === 'drive') { v.sel = sel; v.onAsk('Open this drive'); return; }
    v.sel = sel; v.showSel(); chipsSlot.innerHTML = chipsHtml(['Why did it rise here?', 'What was I doing here?']);
  };
  v.onFile = (text, name) => fileTurn(v, text, name);
  wireComposer(stage, v); ACTIVE = v;
  v.userFile(v.rec.fileName); v.say(dropReply(v.rec), v.rec);
  v.say(brain('why did it rise', v.rec, null), v.rec); v.on = 1; draw();
}

// ===================================================================== V3 Pit wall: the drive is the screen, chat annotates it
function keyMoments(rec) {
  const I = rec.rep.ins, out = [];
  ((I.boost && I.boost.events) || []).filter((e) => e.hard).slice(0, 3).forEach((e) => out.push({ t: e.t0, label: `Hard pull · ${n(e.mapMax, 1)} psi · intake ${n(e.iat0)} °C` }));
  const tl = (I.kc && I.kc.timeline) || [];
  for (let i = 12; i < tl.length && out.filter((m) => m.kind === 'rise').length < 2; i++) {
    if (tl[i].v - tl[i - 12].v >= 0.03 && !out.some((m) => Math.abs(m.t - tl[i].t) < 300)) out.push({ kind: 'rise', t: tl[i - 12].t, label: `Score step ${n(tl[i - 12].v, 2)} → ${n(tl[i].v, 2)}` });
  }
  if (I.lug && I.lug.share >= 4) {
    let best = null;
    for (let i = 0; i + 24 <= tl.length; i += 6) { const s = tl.slice(i, i + 24).reduce((a, p) => a + p.lug, 0); if (!best || s > best.s) best = { s, t: tl[i].t }; }
    if (best) out.push({ t: best.t, len: 120, label: `Most lugging · ${n(I.lug.share, 1)} % of the drive overall` });
  }
  return out.sort((a, b) => a.t - b.t).slice(0, 5);
}
function mountPitWall(stage) {
  const v = { rec: DB.recs.find((r) => r.id.startsWith('20260830-16')), sel: null };
  stage.innerHTML = `<div class="v3"><div class="v3-strip" role="tablist" aria-label="Your drives"></div><div class="v3-main"><div class="v3-board"></div><aside><div class="meta" style="margin-bottom:6px">Key moments · tap to ask</div><div class="v3-moments"></div></aside></div>
    <section class="v3-sheet" aria-label="Ask"><button class="v3-grab" aria-label="Show the whole conversation"></button><div class="v3-log"></div><div class="v3-foot"><div class="chips-slot"></div>${composer('Ask about this drive, or drag on the trace')}</div></section></div>`;
  const strip = stage.querySelector('.v3-strip'), board = stage.querySelector('.v3-board'), moments = stage.querySelector('.v3-moments'), log = stage.querySelector('.v3-log'), sheet = stage.querySelector('.v3-sheet'), chipsSlot = stage.querySelector('.chips-slot');
  sheet.setAttribute('data-min', '');
  stage.querySelector('.v3-grab').onclick = () => sheet.toggleAttribute('data-min');
  const dotColor = { good: 'var(--good-ic)', watch: 'var(--watch-ic)', stop: 'var(--stop-ic)' };
  const draw = () => {
    strip.innerHTML = DB.recs.map((r) => `<button class="v3-drive" role="tab" data-drive="${r.id}" ${r === v.rec ? 'data-on aria-selected="true"' : ''}><b>${dayOf(r.id)}</b><span class="dot" style="background:${dotColor[r.rep.an.verdict] || 'var(--none-ic)'}"></span>${clock(r.id)} · ${Math.round(r.rep.ins.meta.duration / 60)} min</button>`).join('');
    board.innerHTML = W.drive_card(v.rec) + trace(v.rec, v.sel, true);
    moments.innerHTML = keyMoments(v.rec).map((m) => `<button class="v3-moment" data-t="${m.t}" data-len="${m.len || 90}"><span class="mono">${clock(v.rec.id, m.t)}</span>${esc(m.label)}</button>`).join('') || '<div class="meta">No key moments in this drive.</div>';
    const on = strip.querySelector('[data-on]'); on && on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  };
  strip.addEventListener('click', (e) => { const b = e.target.closest('.v3-drive'); if (b) { v.rec = recById(b.dataset.drive); v.sel = null; draw(); v.say(dropReply(v.rec), v.rec); } });
  moments.addEventListener('click', (e) => { const b = e.target.closest('.v3-moment'); if (b) { const t = +b.dataset.t, len = +b.dataset.len; v.onSelect({ kind: 'window', id: v.rec.id, t0: Math.max(0, t - 30), t1: t + len }); } });
  // Answers stay small in the sheet; the trace above is the big picture.
  v.say = (r, rec) => {
    if (r.rec) { v.rec = r.rec; draw(); }
    const cards = r.cards.filter((c) => c !== 'window' && c !== 'drive_trace' && c !== 'drive_card');
    log.insertAdjacentHTML('beforeend', `<div class="msg">${r.text ? `<p class="a-text">${esc(r.text)}</p>` : ''}${cards.map((c) => W[c](v.rec, v.sel)).join('')}${traceLine(r)}</div>`);
    chipsSlot.innerHTML = chipsHtml(r.chips);
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  };
  v.userFile = () => {};
  v.onAsk = (q) => { log.insertAdjacentHTML('beforeend', `<div class="msg u" style="align-self:flex-end">${esc(q)}</div>`); v.say(brain(q, v.rec, v.sel), v.rec); };
  v.onSelect = (sel) => {
    if (sel.kind === 'drive') { v.rec = recById(sel.id); v.sel = null; draw(); v.say(dropReply(v.rec), v.rec); return; }
    v.sel = sel; draw(); v.showSel();
    log.insertAdjacentHTML('beforeend', `<div class="msg u" style="align-self:flex-end">${selLabel(sel)}</div>`);
    v.say(brain('', v.rec, sel), v.rec);   // pointing is asking
  };
  v.onFile = (text, name) => { fileTurn(v, text, name); draw(); };
  wireComposer(stage, v); ACTIVE = v;
  draw(); v.say(dropReply(v.rec), v.rec);
}

// ===================================================================== picker (PICKER.md reference wiring; mount() calls a mount function)
const variants = [mountThread, mountCanvas, mountPitWall];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => variants[i](stage)); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
boot().then(() => {
  setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
}, (err) => { stage.innerHTML = `<div class="boot">Could not read the drives: ${esc(err.message)}</div>`; });
</script>
